<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080e14">
<title>七重</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#060a0e;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;}

  #bg{position:fixed;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #16232c 0%, #0a1218 45%, #05080b 100%);}
  #rain{position:fixed;inset:-20%;
    background-image:repeating-linear-gradient(101deg,
      rgba(150,196,214,0) 0px, rgba(150,196,214,0) 7px,
      rgba(150,196,214,0.050) 7px, rgba(150,196,214,0.050) 8px);
    animation:rainmove 1.35s linear infinite;opacity:.7;}
  @keyframes rainmove{ from{transform:translateY(-120px)} to{transform:translateY(0)} }

  /* ---------------- 纸 ---------------- */
  .sheet{
    position:fixed; left:14px; right:14px; top:20px; bottom:76px;
    border-radius:5px; background:#e9e1cb; background-image:var(--paper);
    background-size:cover; background-position:center; background-blend-mode:multiply;
    box-shadow:0 34px 70px rgba(0,0,0,.55),0 12px 26px rgba(0,0,0,.40),
               0 3px 8px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.35);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;
    box-shadow:inset 0 0 40px rgba(96,76,44,.30),inset 0 0 6px rgba(80,60,32,.25),
               inset 0 -2px 0 rgba(255,248,228,.20),inset 0 -4px 10px rgba(60,44,22,.35);}

  /* ---------------- 头 ---------------- */
  .head{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 13px 6px;}
  .brand{color:#9a7f3e;font-size:14px;letter-spacing:.12em;font-weight:700;white-space:nowrap;}
  .tag{font-size:10px;color:#6d5f45;border:1px solid rgba(110,95,70,.38);
    border-radius:3px;padding:1px 6px;letter-spacing:.10em;}

  /* ---------------- 状态 ---------------- */
  .stat{position:relative;z-index:2;display:flex;gap:12px;align-items:center;
    padding:0 13px 8px;border-bottom:1px solid rgba(110,95,70,.20);}
  .stat .lab{font-size:9px;color:#8a7550;letter-spacing:.14em;}
  .oil{display:flex;gap:2.5px;}
  .oil i{display:block;width:5px;height:11px;border-radius:1px;
    background:rgba(120,104,76,.26);}
  .oil i.on{background:linear-gradient(180deg,#d8a24a,#a8702a);
    box-shadow:0 0 5px rgba(216,162,74,.7);}
  .oil i.dim{background:rgba(140,60,40,.55);}
  .mind{flex:1;height:5px;border-radius:3px;background:rgba(120,104,76,.22);overflow:hidden;}
  .mind p{height:100%;width:100%;background:linear-gradient(90deg,#7d9a8e,#4e6f66);
    transition:width .5s;}
  .mind.low p{background:linear-gradient(90deg,#9a5a46,#6e3128);}

  /* ---------------- 正文 ---------------- */
  .body{position:relative;z-index:2;padding:0 13px;flex:1;display:flex;
    flex-direction:column;min-height:0;overflow:hidden;}
  .where{font-size:17px;color:#4a3f2c;font-weight:700;letter-spacing:.10em;
    margin:10px 0 3px;display:flex;align-items:baseline;gap:8px;}
  .where small{font-size:9.5px;font-weight:400;color:#8a7550;letter-spacing:.1em;}
  .txt{font-size:13.5px;line-height:2.0;color:#4f4535;letter-spacing:.045em;
    margin:4px 0 0;min-height:96px;}
  .txt .hidden{color:rgba(110,90,60,.34);}
  .txt em{font-style:normal;color:#a8442c;}
  .cursor{display:inline-block;width:6px;height:14px;background:#8a7550;
    vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  .txt{flex:none;}
  .art{flex:1;min-height:110px;margin:11px 0 3px;border-radius:0;overflow:hidden;
    position:relative;background:#0d1418;
    border:1px solid rgba(92,76,50,.30);
    box-shadow:0 0 0 3px rgba(120,102,70,.06);
    transform:rotate(-0.42deg);transform-origin:center;}
  .art img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .art canvas{position:absolute;inset:0;width:100%;height:100%;display:none;
    touch-action:none;will-change:transform;transform:translateZ(0);
    contain:paint;}
  .art.d3{background:transparent;
    box-shadow:inset 0 0 0 1px rgba(90,74,48,.34),inset 0 0 26px rgba(120,100,66,.14);}
  .art.d3::after{box-shadow:none;display:none;}
  .art .hint{position:absolute;left:0;right:0;bottom:5px;text-align:center;
    font-size:9px;color:rgba(58,48,34,.46);letter-spacing:.18em;pointer-events:none;z-index:2;}
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(226,214,186,.12),inset 0 0 30px rgba(30,22,12,.30);}
  .art .tape{position:absolute;width:54px;height:14px;pointer-events:none;
    background:linear-gradient(180deg,rgba(228,212,172,.40),rgba(206,190,150,.28));
    box-shadow:0 1px 3px rgba(40,30,14,.35);z-index:2;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}
  .art .tape.a{left:-16px;top:6px;transform:rotate(-44deg);}
  .art .tape.b{right:-16px;bottom:6px;transform:rotate(-44deg);}
  .art.full .tape{display:none;}
  .art.full{position:fixed;left:0;right:0;top:0;bottom:0;z-index:40;margin:0;
    border-radius:0;background:#04070a;display:flex;align-items:center;justify-content:center;}
  .art.full img{width:100%;height:auto;object-fit:contain;}
  .note{position:absolute;z-index:3;pointer-events:none;
    font-family:"Kaiti SC","STKaiti",serif;font-size:11px;color:#b24328;
    letter-spacing:.08em;transform:rotate(-7deg);transform-origin:left bottom;
    text-shadow:0 0 4px rgba(0,0,0,.55);}
  .note::before{content:"";position:absolute;left:-14px;top:5px;
    width:13px;height:1px;background:rgba(178,67,40,.75);
    transform:rotate(22deg);transform-origin:right center;}
  @keyframes shk{
    0%,100%{transform:translate(0,0)}
    14%{transform:translate(-2.5px,1px)}
    30%{transform:translate(2px,-1.5px)}
    46%{transform:translate(-1.5px,-1px)}
    62%{transform:translate(1.5px,1.5px)}
    80%{transform:translate(-1px,0.5px)}
  }
  .sheet.shk{animation:shk .46s ease-out;}
  .ghostline{margin-top:12px;font-size:12px;color:rgba(120,96,64,.62);
    letter-spacing:.10em;animation:fadein .8s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .note.flip{animation:flipit .9s ease;}
  @keyframes flipit{
    0%{opacity:1}28%{opacity:0;transform:rotate(-7deg) scale(1.12)}
    62%{opacity:0;transform:rotate(3deg) scale(.94)}
    100%{opacity:1;transform:rotate(-7deg) scale(1)}
  }
  .cap{font-size:9.5px;color:#8a7550;letter-spacing:.12em;text-align:right;
    margin:3px 2px 0;font-style:italic;}
  .gain{margin-top:8px;font-size:10.5px;color:#a8442c;letter-spacing:.06em;
    opacity:0;transform:translateY(4px);transition:.4s;}
  .gain.show{opacity:1;transform:none;}

  /* ---------------- 动作 ---------------- */
  .acts{position:relative;z-index:2;padding:8px 13px 0;display:flex;gap:7px;flex-wrap:wrap;}
  .btn{flex:1;min-width:88px;border:1px solid rgba(112,96,68,.40);border-radius:3px;
    background:rgba(255,250,236,.14);color:#4f4535;font-size:12px;letter-spacing:.10em;
    padding:9px 6px;text-align:center;font-family:inherit;}
  .btn:active{background:rgba(200,168,104,.24);}
  .btn.ghost{color:#8a7d68;border-color:rgba(112,96,68,.24);}
  .btn:disabled{opacity:.35;}

  /* ---------------- 线索 ---------------- */
  .ask{width:100%;font-size:11.5px;color:#6d5f45;letter-spacing:.10em;
    padding:0 1px 5px;font-style:italic;}
  .cluebar{position:relative;z-index:2;padding:8px 13px 10px;display:flex;gap:5px;flex-wrap:wrap;
    min-height:30px;}
  .cl{font-size:9.5px;color:#6d5f45;border:1px solid rgba(112,96,68,.30);
    border-radius:2px;padding:2px 5px;letter-spacing:.06em;background:rgba(255,250,236,.18);}

  /* ---------------- 地点列表 ---------------- */
  .sheet2{position:fixed;inset:0;z-index:20;display:none;}
  .sheet2.on{display:block;}
  .mask{position:absolute;inset:0;background:rgba(4,7,10,.72);}
  .picker{position:absolute;left:14px;right:14px;bottom:76px;
    border-radius:5px;background:#e9e1cb;background-image:var(--paper);
    background-size:cover;background-position:center;background-blend-mode:multiply;
    box-shadow:0 -18px 50px rgba(0,0,0,.7);padding:12px 13px 14px;
    max-height:64%;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .picker h3{margin:0 0 9px;font-size:12px;color:#8a7550;letter-spacing:.14em;font-weight:400;}
  .pl{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(112,96,68,.20);padding:9px 2px;}
  .pl .n{font-size:13.5px;color:#463c2b;letter-spacing:.06em;font-weight:700;}
  .pl .c{font-size:9.5px;color:#8a7550;letter-spacing:.08em;}
  .pl.gone .n{color:#a09580;text-decoration:line-through;font-weight:400;}
  .pl.here .n{color:#a8442c;}

  /* ---------------- 结局 ---------------- */
  .end{position:fixed;inset:0;z-index:30;background:#04060a;display:none;
    align-items:center;justify-content:center;padding:40px 30px;}
  .end.on{display:flex;}
  .end p{font-size:14px;line-height:2.2;color:#c9b894;letter-spacing:.14em;
    text-align:center;opacity:0;transition:opacity 2.4s;}
  .end p.on{opacity:1;}

  /* ---------------- 底栏 ---------------- */
  .nav{position:fixed;left:0;right:0;bottom:0;height:76px;padding-top:16px;
    display:flex;align-items:stretch;
    background:linear-gradient(180deg,rgba(40,32,22,.99) 0%,rgba(46,37,26,.99) 22%,rgba(32,26,18,1) 100%);
    border-top:1px solid rgba(150,132,96,.14);}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:#8a7856;font-size:8.5px;letter-spacing:.10em;}
  .ni svg{width:17px;height:17px;stroke:#a08d6c;stroke-width:1.15;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  .ni.on{color:#dcc695;}.ni.on svg{stroke:#dcc695;}
</style>
</head>
<body>
<div id="bg"></div><div id="rain"></div>

<div class="sheet">
  <div class="head">
    <div class="brand">七重</div>
    <div class="tag">燈次第</div>
  </div>

  <div class="stat">
    <span class="lab">燈</span>
    <div class="oil" id="oil"></div>
    <span class="lab">神</span>
    <div class="mind" id="mindbox"><p id="mind"></p></div>
  </div>

  <div class="body">
    <div class="where" id="where">山門 · 前庭<small id="visit"></small></div>
    <div class="txt" id="txt"></div>
    <div class="art" id="art"><img id="artimg" alt=""><canvas id="d3"></canvas><i class="tape a"></i><i class="tape b"></i><span class="note" id="note"></span></div>
    <div class="cap" id="cap"></div>
    <div class="gain" id="gain"></div>
  </div>

  <div class="acts" id="acts"></div>
  <div class="cluebar" id="clues"></div>
</div>

<div class="sheet2" id="sheet2">
  <div class="mask" id="mask"></div>
  <div class="picker">
    <h3>去哪一處　·　一處一個時辰</h3>
    <div id="plist"></div>
  </div>
</div>

<div class="end" id="end"><p id="endp"></p></div>

<div class="nav">
  <div class="ni on"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>冊</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>圖</div>
  <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.4-4 3.8-6 7-6s5.6 2 7 6"/></svg>人</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M12 3l7 6-7 12-7-12z"/></svg>物</div>
  <div class="ni"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l5 5"/></svg>證</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>錄</div>
</div>

    var n=Math.max(10,Math.round(len/4));
    var ph=rnd(seed)*6.283;
    x3.beginPath();
    for(var i=0;i<=n;i++){
      var t=i/n;
      var w=Math.sin(t*Math.PI*2.4+ph)*0.68
           +Math.sin(t*Math.PI*5.9+ph*1.7)*0.30
           +Math.sin(t*Math.PI*11.3+ph*2.3)*0.14;
      var j=w*amp;
      var px=a[0]+dx*t+nx*j, py=a[1]+dy*t+ny*j;
      if(i===0) x3.moveTo(px,py); else x3.lineTo(px,py);
    }
  }
  function handLine(a,b,seed,lw,alpha){
    x3.lineCap='round'; x3.lineJoin='round';
    var lg=x3.createLinearGradient(a[0],a[1],b[0],b[1]);
    lg.addColorStop(0,'rgba('+INK+','+(alpha*0.45).toFixed(2)+')');
    lg.addColorStop(0.10,'rgba('+INK+','+alpha+')');
    lg.addColorStop(0.90,'rgba('+INK+','+alpha+')');
    lg.addColorStop(1,'rgba('+INK+','+(alpha*0.45).toFixed(2)+')');
    handPath(a,b,seed,1.15);
    x3.strokeStyle=lg; x3.lineWidth=lw; x3.stroke();
    x3.save(); x3.translate(0.55,-0.4);
    handPath(a,b,seed+31,1.5);
    x3.strokeStyle='rgba('+INK+','+(alpha*0.42).toFixed(2)+')';
    x3.lineWidth=lw*0.7; x3.stroke();
    x3.restore();
  }

  function hatch(pts,dens,seed,alpha,cross){
    x3.save();
    x3.beginPath();
    x3.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++) x3.lineTo(pts[i][0],pts[i][1]);
    x3.closePath(); x3.clip();

    var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
    for(var i=0;i<pts.length;i++){
      minx=Math.min(minx,pts[i][0]); maxx=Math.max(maxx,pts[i][0]);
      miny=Math.min(miny,pts[i][1]); maxy=Math.max(maxy,pts[i][1]);
    }
    var step=Math.max(2.4,26/dens);
    var x0=minx-40,x1=maxx+40,y0=miny-40,y1=maxy+40;

    function oneLine(off,slope,a,sd){
      var N=8, pp=[];
      var ph=rnd(sd+off*0.31)*6.283;
      for(var i=0;i<=N;i++){
        var t=i/N;
        pp.push([x0+(x1-x0)*t, y0+off+(x1-x0)*t*slope+Math.sin(t*4.7+ph)*0.7]);
      }
      var lw=0.65+rnd(sd+off*0.23)*0.55;
      /* 全长，淡 */
      x3.strokeStyle='rgba('+INK+','+(a*0.40).toFixed(2)+')';
      x3.lineWidth=lw;
      x3.beginPath(); x3.moveTo(pp[0][0],pp[0][1]);
      for(var i=1;i<=N;i++) x3.lineTo(pp[i][0],pp[i][1]);
      x3.stroke();
      /* 中段，实 —— 落笔重、两头轻 */
      x3.strokeStyle='rgba('+INK+','+a+')';
      x3.lineWidth=lw*1.15;
      x3.beginPath(); x3.moveTo(pp[1][0],pp[1][1]);
      for(var i=2;i<=N-1;i++) x3.lineTo(pp[i][0],pp[i][1]);
      x3.stroke();
    }
    function run(a,sd){
      var d=0, span=(y1-y0)+(x1-x0);
      while(d<span){
        var grp=3+Math.floor(rnd(sd+d*0.13)*4);
        var gapIn=2.0+rnd(sd+d*0.19)*1.1;
        for(var k=0;k<grp;k++){
          var w=Math.sin((k+0.5)/grp*Math.PI);
          oneLine(d,(rnd(sd+d*0.41+k*7.3)-0.5)*0.17,(a*(0.55+0.65*w)).toFixed(2),sd+k*13);
          d+=gapIn;
        }
        d+=7+rnd(sd+d*0.29)*13;
      }
    }
    run(alpha,seed);
    if(cross) run(alpha*0.5,seed+97);
    x3.restore();
  }

  function draw(){
    VIS = cv3 && cv3.style.display!=='none' && cv3.getBoundingClientRect().width>2;
    if(!x3 || !VIS) return;
    x3.setTransform(DP3,0,0,DP3,0,0);
    x3.setTransform(1,0,0,1,0,0);
    x3.clearRect(0,0,cv3.width,cv3.height);
    x3.setTransform(DP3,0,0,DP3,0,0);
    upd();
    PXc=W3*0.5; PYc=H3*0.46; PSc=Math.min(W3*0.78, H3*2.1);

    var faces=[];
    for(var i=0;i<BOX.F.length;i++){
      var f=BOX.F[i], nb=pjn(f.n);
      if(nb[2]>-0.06) continue;
      var pts=[];
      for(var j=0;j<f.v.length;j++) pts.push(pjv(f.v[j]));
      faces.push({pts:pts,n:nb,dep:nb[2]});
    }
    faces.sort(function(a,b){return a.dep-b.dep;});

    var fast = drag.on;   /* 手指按着的时候只留骨架，松开再补排线 */

    if(!fast){
      for(var i=0;i<faces.length;i++){
        var fd=faces[i];
        var lit=-fd.n[0]*0.42-fd.n[1]*0.52+fd.n[2]*0.30;
        var a=cl(lit,0,1);
        if(a>0.08) hatch(fd.pts, 5+a*13, i*37+11, (0.10+a*0.24).toFixed(2), a>0.55);
      }
    }

    if(fast){
      /* 快画：一条线一笔，不抖不描 */
      x3.lineCap='round';
      x3.strokeStyle='rgba('+INK+',0.62)';
      x3.lineWidth=1.3;
      x3.beginPath();
      for(var i=0;i<BOX.E.length;i++){
        var pa=pjv(BOX.E[i][0]), pb=pjv(BOX.E[i][1]);
        x3.moveTo(pa[0],pa[1]); x3.lineTo(pb[0],pb[1]);
      }
      x3.stroke();
    } else {
      for(var i=0;i<BOX.E.length;i++){
        handLine(pjv(BOX.E[i][0]), pjv(BOX.E[i][1]), i*53+7, 1.4, 0.78);
      }
    }

    /* 尺寸线 */
    var ay=PYc+BOX.h*PSc*1.12;
    x3.save();
    x3.strokeStyle='rgba('+INK+',0.40)';
    x3.setLineDash([4,4]); x3.lineWidth=0.9;
    x3.beginPath();
    x3.moveTo(PXc-BOX.w*PSc*0.55, ay); x3.lineTo(PXc+BOX.w*PSc*0.55, ay);
    x3.stroke();
    x3.restore();
    x3.save();
    x3.fillStyle='rgba('+INK+',0.68)';
    x3.font='10px '+SERIF2;
    x3.textAlign='center';
    x3.fillText('一尺二寸', PXc, ay+14);
    x3.restore();
  }

  function loop(){
    if (!drag.on && (Math.abs(spin.v)>0.0004 || Math.abs(spin.vx)>0.0004)){
      cam.ry += spin.v;
      cam.rx = cl(cam.rx + spin.vx, -0.9, 0.9);
      spin.v *= 0.92; spin.vx *= 0.92;
      NEXT = true;
    }
    if (NEXT){ NEXT=false; draw(); }
    requestAnimationFrame(loop);
  }

  function resize(){
    if(!cv3) return;
    var r=cv3.getBoundingClientRect();
    if(r.width<2) return;
    W3=Math.round(r.width); H3=Math.round(r.height);
    DP3=Math.min(2,window.devicePixelRatio||1);
    cv3.width=Math.floor(W3*DP3); cv3.height=Math.floor(H3*DP3);
  }

  function init(el){
    cv3=el; x3=el.getContext('2d');
    cv3.addEventListener('pointerdown',function(e){
      RECT=cv3.getBoundingClientRect();
      drag.on=true; drag.lx=e.clientX-RECT.left; drag.ly=e.clientY-RECT.top;
      DV=1.0; NEXT=true;
    },{passive:true});
    cv3.addEventListener('pointermove',function(e){
      if(!drag.on) return;
      if(!RECT) RECT=cv3.getBoundingClientRect();
      var x=e.clientX-RECT.left, y=e.clientY-RECT.top;
      var dx=(x-drag.lx), dy=(y-drag.ly);
      cam.ry+=dx*0.0072;
      cam.rx=cl(cam.rx+dy*0.0045,-0.9,0.9);
      drag.lx=x; drag.ly=y;
      /* 记下这一下的速度，松手后让它自己再转一会儿 */
      var t=performance.now();
      if (spin.lt) spin.v = dx*0.0072/Math.max(8, t-spin.lt)*16;
      spin.vx = dy*0.0045/Math.max(8, t-spin.lt)*16;
      spin.lt=t;
      NEXT=true;
    },{passive:true});
    cv3.addEventListener('pointerup',function(){
      drag.on=false; RECT=null;
      spin.v=cl(spin.v,-0.12,0.12); spin.vx=cl(spin.vx,-0.08,0.08);
      NEXT=true;
      setTimeout(function(){ NEXT=true; }, 80);
    },{passive:true});
    cv3.addEventListener('pointercancel',function(){
      drag.on=false; RECT=null; spin.v=0; spin.vx=0; NEXT=true;
    },{passive:true});
    resize();
    NEXT=true;
    loop();
  }
  return {init:init, resize:resize, redraw:function(){ NEXT=true; },
          bench:function(n){ var t=performance.now(); for(var i=0;i<n;i++) draw(); return (performance.now()-t)/n; }};
})();

/* ============================================================
   状态
   ============================================================ */
var S = {
  oil: OIL_MAX,
  mind: 100,
  at: 'gate',
  seen: {},          /* 每个地点看过第几条 */
  clues: [],
  opened: 0,
  ended: false,
  evDone: {},
  pending: null,
  gone: false        /* 掀开一重之后，藏经阁不在了 */
};

/* ============================================================
   事件：看完一处之后，有东西回应你
   ============================================================ */
function shake(){
  var sh = document.querySelector('.sheet');
  if (!sh) return;
  sh.classList.remove('shk');
  void sh.offsetWidth;
  sh.classList.add('shk');
  setTimeout(function(){ sh.classList.remove('shk'); }, 460);
}
function ghostLine(txt){
  var t = $('txt');
  var d = document.createElement('div');
  d.className = 'ghostline';
  d.textContent = txt;
  t.appendChild(d);
}

var EVENTS = {
  /* 山门：你明明只来过两次，它记得三次 */
  gate: function(){
    S.oil = Math.max(0, S.oil - 1);
    renderStat();
    shake();
    ghostLine('（你記得只來過兩次。）');
  },
  /* 大殿：你自己写的批注，被改了 */
  hall: function(){
    shake();
    var n = $('note');
    if (n){
      n.textContent = '臉回來了';
      n.classList.add('flip');
    }
    setTimeout(function(){
      ghostLine('（那不是你寫的字。）');
    }, 700);
  },
  /* 后山：坑的尺寸变了 */
  yard: function(){
    shake();
    var t = $('txt');
    var d = document.createElement('div');
    d.className = 'ghostline';
    d.textContent = '（你量過的。你確定。）';
    t.appendChild(d);
    setTimeout(function(){
      S.mind = Math.max(0, S.mind - 6);
      renderStat();
    }, 900);
  }
};

/* ============================================================
   工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function put(html){ $('txt').innerHTML = html; }
/* 【】里的字用朱砂 —— 抄本里只有神名、忌讳、和数目才用红 */
function mark(t){
  return t.replace(/【([^】]*)】/g, '<em>$1</em>');
}

/* 打字机：先清空，再逐字填。第二次起不再打，直接显示。 */
var typer = null;
function say(text, instant){
  if (typer) clearInterval(typer);
  var target = $('txt');
  if (instant){
    target.innerHTML = text.replace(/\n/g,'<br>');
    return;
  }
  target.innerHTML = '';
  var i = 0;
  var cur = document.createElement('span');
  cur.className = 'cursor';
  target.appendChild(cur);
  typer = setInterval(function(){
    i++;
    target.innerHTML = mark(text.slice(0,i)).replace(/\n/g,'<br>');
    var c = document.createElement('span');
    c.className = 'cursor';
    target.appendChild(c);
    if (i >= text.length){ clearInterval(typer); typer = null;
      setTimeout(function(){ if (target.lastChild && target.lastChild.className==='cursor') target.removeChild(target.lastChild); }, 1100);
    }
  }, 42);
}

/* ============================================================
   渲染
   ============================================================ */
function renderStat(){
  var oil = $('oil');
  oil.innerHTML = '';
  for (var i=0;i<OIL_MAX;i++){
    var d = document.createElement('i');
    if (i < S.oil) d.className = (S.oil <= 3) ? 'on dim' : 'on';
    oil.appendChild(d);
  }
  var mb = $('mindbox');
  $('mind').style.width = Math.max(0, S.mind) + '%';
  if (S.mind < 55) mb.classList.add('low'); else mb.classList.remove('low');
}

function renderClues(){
  var c = $('clues');
  c.innerHTML = '';
  for (var i=0;i<S.clues.length;i++){
    var d = document.createElement('span');
    d.className = 'cl';
    d.textContent = S.clues[i].id;
    c.appendChild(d);
  }
}

function renderActs(){
  var a = $('acts');
  a.innerHTML = '';

  /* 正在问你记不记 */
  if (S.pending){
    var q = document.createElement('div');
    q.className = 'ask';
    q.textContent = S.pending.q;
    a.appendChild(q);

    var y = document.createElement('div');
    y.className = 'btn';
    y.textContent = '記入冊中';
    y.onclick = function(){
      var pd = S.pending; S.pending = null;
      S.clues.push({id:pd.id, txt:pd.txt});
      S.mind = Math.max(0, S.mind - 8);
      renderClues(); renderStat();
      flash('記下了。');
      renderActs();
      setTimeout(EVENTS[pd.place], 1600);
    };
    a.appendChild(y);

    var n = document.createElement('div');
    n.className = 'btn ghost';
    n.textContent = '不記';
    n.onclick = function(){
      var pd = S.pending; S.pending = null;
      flash('你什麼都沒寫。');
      renderActs();
      setTimeout(EVENTS[pd.place], 900);
    };
    a.appendChild(n);
    return;
  }
  var p = PLACES[S.at];

  /* 细看 */
  var seen = S.seen[S.at] || 0;
  if (seen < p.lines.length && !(p.lock && !S.gone)){
    var b = document.createElement('div');
    b.className = 'btn';
    b.setAttribute('data-act','look');
    b.textContent = seen === 0 ? '細看' : '再看一眼';
    b.onclick = function(){ look(); };
    a.appendChild(b);
  }

  /* 开锁 */
  if (S.at === 'box' && S.opened === 0){
    var b2 = document.createElement('div');
    b2.className = 'btn';
    b2.setAttribute('data-act','open');
    var enough = S.clues.length >= OPEN_NEED;
    b2.textContent = enough ? '開第一重' : ('還差 ' + (OPEN_NEED - S.clues.length) + ' 條');
    if (!enough) b2.className = 'btn ghost';
    b2.onclick = function(){ if (enough) openFirst(); else flash('你對不上。'); };
    a.appendChild(b2);
  }

  /* 走 */
  var b3 = document.createElement('div');
  b3.className = 'btn ghost';
  b3.setAttribute('data-act','go');
  b3.textContent = '去別處';
  b3.onclick = function(){ showPicker(); };
  a.appendChild(b3);
}

function flash(msg){
  var g = $('gain');
  g.textContent = msg;
  g.classList.add('show');
  setTimeout(function(){ g.classList.remove('show'); }, 1500);
}

/* ============================================================
   核心动作
   ============================================================ */
function spend(n){
  if (S.ended) return false;
  if (S.oil <= 0) return false;
  S.oil = Math.max(0, S.oil - n);
  renderStat();
  if (S.oil <= 0){ setTimeout(endingOil, 900); return false; }
  return true;
}

function look(){
  if (S.ended) return;
  var p = PLACES[S.at];
  var seen = S.seen[S.at] || 0;
  if (seen >= p.lines.length) return;
  if (!spend(1)) return;

  S.seen[S.at] = seen + 1;

  var line = p.lines[seen];

  /* 神智：看得越深，掉得越多 */
  if (seen > 0){
    S.mind = Math.max(0, S.mind - (7 + seen*4));
    renderStat();
  }

  /* 神智低的时候，字里会多出一层 */
  var extra = '';
  if (S.mind < 52 && seen >= 1){
    extra = '\n<span class="hidden">（你確定剛才數的是這個數？）</span>';
  }
  say(line + extra, false);

  /* 得线索 */
  if (p.clue && p.clue.at === seen && !hasClue(p.clue.id)){
    S.clues.push(p.clue);
    renderClues();
    setTimeout(function(){ flash('得：' + p.clue.txt); }, 600);
  }

  renderActs();

  /* 看到最后一条：先问记不记；记与不记，后面的事不一样 */
  if (seen === p.lines.length-1 && !S.evDone[S.at]){
    S.evDone[S.at] = 1;
    if (p.clue){
      S.pending = {place:S.at, q:'這一處，記下來麼？', id:p.clue.id, txt:p.clue.txt};
      renderActs();
    } else {
      setTimeout(EVENTS[S.at], 900);
    }
  }

  /* 三处看尽，藏经阁自己不锁了 */
  if (S.at === 'lib' && seen === 1 && !S.gone){
    flash('裡面的人，停下筆了。');
  }
}

function go(id){
  if (S.ended) return;
  hidePicker();
  if (id === S.at){ renderActs(); return; }
  if (PLACES[id].lock && !S.gone){
    say(PLACES[id].lock, false);
    return;
  }
  if (!spend(PLACES[id].cost)) return;
  S.at = id;
  var seen = S.seen[id] || 0;
  $('where').innerHTML = PLACES[id].name +
    '<small>' + (seen === 0 ? '' : ('來過　' + seen + ' 次')) + '</small>';
  say(PLACES[id].lines[Math.max(0, Math.min(seen, PLACES[id].lines.length-1))], false);
  curPlace = id;
  setArt(PLACES[id].art, id === 'box');
  renderActs();
}

function openFirst(){
  S.opened = 1;
  S.mind = Math.max(0, S.mind - 20);
  S.gone = true;
  renderStat();

  /* 世界变了一点 */
  $('where').innerHTML = '石函 · 第一重<small>開了</small>';
  say('鎖掉在石頭上，聲音很悶，像掉進很深的東西裡。\n裡面還有一重。\n\n你回頭，走廊那頭的藏經閣不見了。\n不是黑了，是不見了。', false);

  S.clues.push({id:'第一重', txt:'裡面還有一重'});
  renderClues();
  renderActs();
}

function endingOil(){
  if (S.ended) return;
  S.ended = true;
  var e = $('end'), p = $('endp');
  e.classList.add('on');
  setTimeout(function(){
    p.innerHTML = '燈滅了。<br><br>庵還在。<br>你不在。';
    p.classList.add('on');
  }, 400);
}

/* ============================================================
   地点选择
   ============================================================ */
function showPicker(){
  var list = $('plist');
  list.innerHTML = '';
  for (var k in PLACES){
    var p = PLACES[k];
    var gone = (k === 'lib' && S.gone);
    var row = document.createElement('div');
    row.className = 'pl' + (gone ? ' gone' : '') + (k === S.at ? ' here' : '');
    row.innerHTML = '<span class="n">' + (gone ? '（那個門）' : p.name) + '</span>' +
                    '<span class="c">' + (gone ? '' : (k === S.at ? '在這' : '一時辰')) + '</span>';
    if (!gone){
      (function(kk){ row.onclick = function(){ go(kk); }; })(k);
    }
    list.appendChild(row);
  }
  $('sheet2').classList.add('on');
}
function hidePicker(){ $('sheet2').classList.remove('on'); }

function hasClue(id){
  for (var i=0;i<S.clues.length;i++) if (S.clues[i].id === id) return true;
  return false;
}

/* ============================================================
   启动
   ============================================================ */
var CAPS = {gate:'圖一　山門 · 雨夜', hall:'圖二　大殿 · 三尊', yard:'圖三　後山 · 掘坑',
            kitchen:'圖四　齋堂 · 六席', lib:'圖五　藏經閣', box:''};
var NOTES = {
  gate:    {x:58, y:54, t:'此處'},
  hall:    {x:44, y:34, t:'臉沒了'},
  yard:    {x:36, y:64, t:'底有印'},
  kitchen: {x:24, y:48, t:'還溫'},
  lib:     {x:50, y:48, t:'有光'},
  box:     null
};
var curPlace = 'gate';
function setArt(src, is3d){
  var a = $('art');
  a.classList.remove('full');
  if (is3d){
    a.classList.add('d3');

    $('d3').style.display = 'none';
