<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080e14">
<title>七重</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#060a0e;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;}

  #bg{position:fixed;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #16232c 0%, #0a1218 45%, #05080b 100%);}
  #rain{position:fixed;inset:-20%;
    background-image:repeating-linear-gradient(101deg,
      rgba(150,196,214,0) 0px, rgba(150,196,214,0) 7px,
      rgba(150,196,214,0.050) 7px, rgba(150,196,214,0.050) 8px);
    animation:rainmove 1.35s linear infinite;opacity:.7;}
  @keyframes rainmove{ from{transform:translateY(-120px)} to{transform:translateY(0)} }

  /* ---------------- 纸 ---------------- */
  .sheet{
    position:fixed; left:14px; right:14px; top:20px; bottom:76px;
    border-radius:5px; background:#e9e1cb; background-image:var(--paper);
    background-size:cover; background-position:center; background-blend-mode:multiply;
    box-shadow:0 34px 70px rgba(0,0,0,.55),0 12px 26px rgba(0,0,0,.40),
               0 3px 8px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.35);
    overflow:hidden; display:flex; flex-direction:column;
  }
  .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:5px;
    box-shadow:inset 0 0 40px rgba(96,76,44,.30),inset 0 0 6px rgba(80,60,32,.25),
               inset 0 -2px 0 rgba(255,248,228,.20),inset 0 -4px 10px rgba(60,44,22,.35);}

  /* ---------------- 头 ---------------- */
  .head{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 13px 6px;}
  .brand{color:#9a7f3e;font-size:14px;letter-spacing:.12em;font-weight:700;white-space:nowrap;}
  .tag{font-size:10px;color:#6d5f45;border:1px solid rgba(110,95,70,.38);
    border-radius:3px;padding:1px 6px;letter-spacing:.10em;}

  /* ---------------- 状态 ---------------- */
  .stat{position:relative;z-index:2;display:flex;gap:12px;align-items:center;
    padding:0 13px 8px;border-bottom:1px solid rgba(110,95,70,.20);}
  .stat .lab{font-size:9px;color:#8a7550;letter-spacing:.14em;}
  .oil{display:flex;gap:2.5px;}
  .oil i{display:block;width:4.4px;height:11px;border-radius:1px;
    background:rgba(120,104,76,.26);}
  .oil i.on{background:linear-gradient(180deg,#d8a24a,#a8702a);
    box-shadow:0 0 5px rgba(216,162,74,.7);}
  .oil i.dim{background:rgba(140,60,40,.55);}
  .stat .num{font-size:9px;color:#8a7550;letter-spacing:.06em;margin-left:2px;}
  .mind{flex:1;height:5px;border-radius:3px;background:rgba(120,104,76,.22);overflow:hidden;}
  .mind p{height:100%;width:100%;background:linear-gradient(90deg,#7d9a8e,#4e6f66);
    transition:width .5s;}
  .mind.low p{background:linear-gradient(90deg,#9a5a46,#6e3128);}

  /* ---------------- 正文 ---------------- */
  .body{position:relative;z-index:2;padding:0 13px;flex:1;display:flex;
    flex-direction:column;min-height:0;overflow:hidden;}
  .where{font-size:17px;color:#4a3f2c;font-weight:700;letter-spacing:.10em;
    margin:10px 0 3px;display:flex;align-items:baseline;gap:8px;}
  .where small{font-size:9.5px;font-weight:400;color:#8a7550;letter-spacing:.1em;}
  .txt{font-size:15px;line-height:2.05;color:#4f4535;letter-spacing:.05em;
    margin:6px 0 0;flex:1;overflow:auto;padding-bottom:6px;}
  .txt .hidden{color:rgba(110,90,60,.34);}
  .cursor{display:inline-block;width:6px;height:14px;background:#8a7550;
    vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  .gain{margin-top:8px;font-size:10.5px;color:#a8442c;letter-spacing:.06em;
    opacity:0;transform:translateY(4px);transition:.4s;}
  .gain.show{opacity:1;transform:none;}

  /* ---------------- 动作 ---------------- */
  .acts{position:relative;z-index:2;padding:8px 13px 0;display:flex;gap:7px;flex-wrap:wrap;}
  .btn{flex:1;min-width:88px;border:1px solid rgba(112,96,68,.40);border-radius:3px;
    background:rgba(255,250,236,.14);color:#4f4535;font-size:12px;letter-spacing:.10em;
    padding:9px 6px;text-align:center;font-family:inherit;}
  .btn:active{background:rgba(200,168,104,.24);}
  .btn.ghost{color:#8a7d68;border-color:rgba(112,96,68,.24);}
  .btn:disabled{opacity:.35;}

  /* ---------------- 线索 ---------------- */
  .cluebar{position:relative;z-index:2;padding:7px 13px 10px;display:flex;gap:5px;flex-wrap:wrap;
    min-height:30px;align-items:center;border-top:1px solid rgba(110,95,70,.20);}
  .cluebar .lab{font-size:9px;color:#8a7550;letter-spacing:.14em;margin-right:2px;}
  .cl{font-size:9.5px;color:#6d5f45;border:1px solid rgba(112,96,68,.30);
    border-radius:2px;padding:2px 5px;letter-spacing:.06em;background:rgba(255,250,236,.18);}

  /* ---------------- 地点列表 ---------------- */
  .sheet2{position:fixed;inset:0;z-index:20;display:none;}
  .sheet2.on{display:block;}
  .mask{position:absolute;inset:0;background:rgba(4,7,10,.72);}
  .picker{position:absolute;left:14px;right:14px;bottom:76px;
    border-radius:5px;background:#e9e1cb;background-image:var(--paper);
    background-size:cover;background-position:center;background-blend-mode:multiply;
    box-shadow:0 -18px 50px rgba(0,0,0,.7);padding:12px 13px 14px;
    max-height:64%;overflow:auto;}
  .picker h3{margin:0 0 9px;font-size:12px;color:#8a7550;letter-spacing:.14em;font-weight:400;}
  .pl{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(112,96,68,.20);padding:9px 2px;}
  .pl .n{font-size:13.5px;color:#463c2b;letter-spacing:.06em;font-weight:700;}
  .pl .c{font-size:9.5px;color:#8a7550;letter-spacing:.08em;}
  .pl.gone .n{color:#a09580;text-decoration:line-through;font-weight:400;}
  .pl.here .n{color:#a8442c;}

  /* ---------------- 结局 ---------------- */
  .end{position:fixed;inset:0;z-index:30;background:#04060a;display:none;
    align-items:center;justify-content:center;padding:40px 30px;}
  .end.on{display:flex;}
  .end p{font-size:14px;line-height:2.2;color:#c9b894;letter-spacing:.14em;
    text-align:center;opacity:0;transition:opacity 2.4s;}
  .end p.on{opacity:1;}

  /* ---------------- 底栏 ---------------- */
  .nav{position:fixed;left:0;right:0;bottom:0;height:76px;padding-top:16px;
    display:flex;align-items:stretch;
    background:linear-gradient(180deg,rgba(40,32,22,.99) 0%,rgba(46,37,26,.99) 22%,rgba(32,26,18,1) 100%);
    border-top:1px solid rgba(150,132,96,.14);}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:#8a7856;font-size:8.5px;letter-spacing:.10em;}
  .ni svg{width:17px;height:17px;stroke:#a08d6c;stroke-width:1.15;fill:none;
    stroke-linecap:round;stroke-linejoin:round;}
  .ni.on{color:#dcc695;}.ni.on svg{stroke:#dcc695;}
</style>
</head>
<body>
<div id="bg"></div><div id="rain"></div>

<div class="sheet">
  <div class="head">
    <div class="brand">七重</div>
    <div class="tag">燈次第</div>
  </div>

  <div class="stat">
    <span class="lab" id="oillab">燈油 10</span>
    <div class="oil" id="oil"></div>
    <span class="lab" id="mindlab">神智 100</span>
    <div class="mind" id="mindbox"><p id="mind"></p></div>
  </div>

  <div class="body">
    <div class="where" id="where">山門 · 前庭<small id="visit"></small></div>
    <div class="txt" id="txt"></div>
    <div class="gain" id="gain"></div>
  </div>

  <div class="acts" id="acts"></div>
  <div class="cluebar" id="clues"></div>
</div>

<div class="sheet2" id="sheet2">
  <div class="mask" id="mask"></div>
  <div class="picker">
    <h3>去哪一處　·　一處一個時辰</h3>
    <div id="plist"></div>
  </div>
</div>

<div class="end" id="end"><p id="endp"></p></div>

<div class="nav">
  <div class="ni on"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>冊</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>圖</div>
  <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.4-4 3.8-6 7-6s5.6 2 7 6"/></svg>人</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M12 3l7 6-7 12-7-12z"/></svg>物</div>
  <div class="ni"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="M15 15l5 5"/></svg>證</div>
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>錄</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   数据
   ============================================================ */
var OIL_MAX = 12;

var PLACES = {
  gate: {
    name:'山門 · 前庭', cost:1,
    lines:[
      '石階濕滑，苔從縫裡長出來。門檻上有一道很深的車轍。',
      '車轍是新的。可這座山，沒有車能上來。',
      '你在門檻上看見自己的腳印。\n只有進去的，沒有出來的。'
    ],
    clue:{ at:1, id:'腳印', txt:'門檻上只有進去的腳印' }
  },
  hall: {
    name:'大殿 · 佛前', cost:1,
    lines:[
      '三尊像，中間那尊的臉被人鑿掉了。',
      '鑿痕是新的，石屑還在。鑿它的人，用的是左手。',
      '你又數了一遍。三尊。\n再數一遍，四尊。'
    ],
    clue:{ at:1, id:'鑿痕', txt:'鑿痕是新的，用的是左手' }
  },
  yard: {
    name:'後山 · 掘坑', cost:1,
    lines:[
      '四尺深。土是新翻的，周圍卻沒有擾動。',
      '坑底有一圈壓痕，像是什麼在裡面坐了很久。',
      '你量了坑。\n和石函一樣的尺寸。\n可石函是從這坑裡挖出來的。'
    ],
    clue:{ at:1, id:'坑深', txt:'坑的尺寸與石函相同' }
  },
  kitchen: {
    name:'齋堂', cost:1,
    lines:[
      '六副碗筷，住著三個人。',
      '桌上有一碗還溫著。你摸了摸，是溫的。',
      '碗底刻著名字。\n三個是活人的。\n三個不是。'
    ],
    clue:{ at:2, id:'名字', txt:'碗底有六個名字，三個不是活人的' }
  },
  lib: {
    name:'藏經閣', cost:1, lock:'住持身上有鑰匙。他三個月沒出來了。',
    lines:[
      '門鎖著。縫裡沒有光。',
      '門縫裡透出一點光。有人在裡面翻書。',
      '翻書聲停了。\n然後是翻書聲。'
    ]
  },
  box: {
    name:'石函 · 第一重', cost:1,
    lines:[
      '鎖已鏽。鎖扣未動。',
      '四把鎖。\n早上你數的是三把。'
    ]
  }
};

/* 需要三条线索才开得动第一重 */
var OPEN_NEED = 3;

/* ============================================================
   状态
   ============================================================ */
var S = {
  oil: OIL_MAX,
  mind: 100,
  at: 'gate',
  seen: {},          /* 每个地点看过第几条 */
  clues: [],
  opened: 0,
  ended: false,
  gone: false        /* 掀开一重之后，藏经阁不在了 */
};

/* ============================================================
   工具
   ============================================================ */
function $(id){ return document.getElementById(id); }
function put(html){ $('txt').innerHTML = html; }

/* 打字机：先清空，再逐字填。第二次起不再打，直接显示。 */
var typer = null;
function say(text, instant){
  if (typer) clearInterval(typer);
  var target = $('txt');
  if (instant){
    target.innerHTML = text.replace(/\n/g,'<br>') +
      '<div style="text-align:right;color:rgba(120,100,70,.40);font-size:11px;margin-top:10px;letter-spacing:.2em;">ゝ</div>';
    return;
  }
  target.innerHTML = '';
  var i = 0;
  var cur = document.createElement('span');
  cur.className = 'cursor';
  target.appendChild(cur);
  typer = setInterval(function(){
    i++;
    target.innerHTML = text.slice(0,i).replace(/\n/g,'<br>');
    if (i >= text.length) target.innerHTML += '<div style="text-align:right;color:rgba(120,100,70,.40);font-size:11px;margin-top:10px;letter-spacing:.2em;">ゝ</div>';
    var c = document.createElement('span');
    c.className = 'cursor';
    target.appendChild(c);
    if (i >= text.length){ clearInterval(typer); typer = null;
      setTimeout(function(){ if (target.lastChild && target.lastChild.className==='cursor') target.removeChild(target.lastChild); }, 1100);
    }
  }, 42);
}

/* ============================================================
   渲染
   ============================================================ */
function renderStat(){
  var oil = $('oil');
  oil.innerHTML = '';
  for (var i=0;i<OIL_MAX;i++){
    var d = document.createElement('i');
    if (i < S.oil) d.className = (S.oil <= 3) ? 'on dim' : 'on';
    oil.appendChild(d);
  }
  var mb = $('mindbox');
  $('mind').style.width = Math.max(0, S.mind) + '%';
  if (S.mind < 55) mb.classList.add('low'); else mb.classList.remove('low');
  $('oillab').textContent = '燈油 ' + S.oil;
  $('mindlab').textContent = '神智 ' + S.mind;
}

function renderClues(){
  var c = $('clues');
  c.innerHTML = '';
  if (S.clues.length){
    var lb = document.createElement('span');
    lb.className = 'lab';
    lb.textContent = '已得';
    c.appendChild(lb);
  }
  for (var i=0;i<S.clues.length;i++){
    var d = document.createElement('span');
    d.className = 'cl';
    d.textContent = S.clues[i].id;
    c.appendChild(d);
  }
}

function renderActs(){
  var a = $('acts');
  a.innerHTML = '';
  var p = PLACES[S.at];

  /* 细看 */
  var seen = S.seen[S.at] || 0;
  if (seen < p.lines.length && !(p.lock && !S.gone)){
    var b = document.createElement('div');
    b.className = 'btn';
    b.setAttribute('data-act','look');
    b.textContent = seen === 0 ? '細看' : '再看一眼';
    b.onclick = function(){ look(); };
    a.appendChild(b);
  }

  /* 开锁 */
  if (S.at === 'box' && S.opened === 0){
    var b2 = document.createElement('div');
    b2.className = 'btn';
    b2.setAttribute('data-act','open');
    var enough = S.clues.length >= OPEN_NEED;
    b2.textContent = enough ? '開第一重' : ('還差 ' + (OPEN_NEED - S.clues.length) + ' 條');
    if (!enough) b2.className = 'btn ghost';
    b2.onclick = function(){ if (enough) openFirst(); else flash('你對不上。'); };
    a.appendChild(b2);
  }

  /* 走 */
  var b3 = document.createElement('div');
  b3.className = 'btn ghost';
  b3.setAttribute('data-act','go');
  b3.textContent = '去別處';
  b3.onclick = function(){ showPicker(); };
  a.appendChild(b3);
}

function flash(msg){
  var g = $('gain');
  g.textContent = msg;
  g.classList.add('show');
  setTimeout(function(){ g.classList.remove('show'); }, 1500);
}

/* ============================================================
   核心动作
   ============================================================ */
function spend(n){
  if (S.ended) return false;
  if (S.oil <= 0) return false;
  S.oil = Math.max(0, S.oil - n);
  renderStat();
  if (S.oil <= 0){ setTimeout(endingOil, 900); return false; }
  return true;
}

function look(){
  if (S.ended) return;
  var p = PLACES[S.at];
  var seen = S.seen[S.at] || 0;
  if (seen >= p.lines.length) return;
  if (!spend(1)) return;

  S.seen[S.at] = seen + 1;

  var line = p.lines[seen];

  /* 神智：看得越深，掉得越多 */
  if (seen > 0){
    S.mind = Math.max(0, S.mind - (7 + seen*4));
    renderStat();
  }

  /* 神智低的时候，字里会多出一层 */
  var extra = '';
  if (S.mind < 52 && seen >= 1){
    extra = '\n<span class="hidden">（你確定剛才數的是這個數？）</span>';
  }
  say(line + extra, false);

  /* 得线索 */
  if (p.clue && p.clue.at === seen && !hasClue(p.clue.id)){
    S.clues.push(p.clue);
    renderClues();
    setTimeout(function(){ flash('得：' + p.clue.txt); }, 600);
  }

  renderActs();

  /* 三处看尽，藏经阁自己不锁了 */
  if (S.at === 'lib' && seen === 1 && !S.gone){
    flash('裡面的人，停下筆了。');
  }
}

function go(id){
  if (S.ended) return;
  hidePicker();
  if (id === S.at){ renderActs(); return; }
  if (PLACES[id].lock && !S.gone){
    say(PLACES[id].lock, false);
    return;
  }
  if (!spend(PLACES[id].cost)) return;
  S.at = id;
  var seen = S.seen[id] || 0;
  $('where').innerHTML = PLACES[id].name +
    '<small>' + (seen === 0 ? '' : ('來過　' + seen + ' 次')) + '</small>';
  say(PLACES[id].lines[Math.max(0, Math.min(seen, PLACES[id].lines.length-1))], false);
  renderActs();
}

function openFirst(){
  S.opened = 1;
  S.mind = Math.max(0, S.mind - 20);
  S.gone = true;
  renderStat();

  /* 世界变了一点 */
  $('where').innerHTML = '石函 · 第一重<small>開了</small>';
  say('鎖掉在石頭上，聲音很悶，像掉進很深的東西裡。\n裡面還有一重。\n\n你回頭，走廊那頭的藏經閣不見了。\n不是黑了，是不見了。', false);

  S.clues.push({id:'第一重', txt:'裡面還有一重'});
  renderClues();
  renderActs();
}

function endingOil(){
  if (S.ended) return;
  S.ended = true;
  var e = $('end'), p = $('endp');
  e.classList.add('on');
  setTimeout(function(){
    p.innerHTML = '燈滅了。<br><br>庵還在。<br>你不在。';
    p.classList.add('on');
  }, 400);
}

/* ============================================================
   地点选择
   ============================================================ */
function showPicker(){
  var list = $('plist');
  list.innerHTML = '';
  for (var k in PLACES){
    var p = PLACES[k];
    var gone = (k === 'lib' && S.gone);
    var row = document.createElement('div');
    row.className = 'pl' + (gone ? ' gone' : '') + (k === S.at ? ' here' : '');
    row.innerHTML = '<span class="n">' + (gone ? '（那個門）' : p.name) + '</span>' +
                    '<span class="c">' + (gone ? '' : (k === S.at ? '在這' : '一時辰')) + '</span>';
    if (!gone){
      (function(kk){ row.onclick = function(){ go(kk); }; })(k);
    }
    list.appendChild(row);
  }
  $('sheet2').classList.add('on');
}
function hidePicker(){ $('sheet2').classList.remove('on'); }

function hasClue(id){
  for (var i=0;i<S.clues.length;i++) if (S.clues[i].id === id) return true;
  return false;
}

/* ============================================================
