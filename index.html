<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尘封档案 · 选择</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#05080a;color:#d8ceb4;overflow:hidden;
  font-family:'Songti SC','SimSun','Noto Serif CJK SC',serif;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 46%, rgba(255,214,150,.055), transparent 70%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
.wrap{position:relative;z-index:2;text-align:center;padding:6vw;}
.head{
  font-size:11px;letter-spacing:.62em;color:#8d8468;opacity:.85;margin-bottom:2.4em;
}
h1{
  font-size:clamp(30px,5.2vw,54px);letter-spacing:.42em;font-weight:400;
  color:#e9dfc4;text-shadow:0 0 40px rgba(255,220,160,.12);margin-bottom:.5em;
}
.sub{
  font-size:12px;letter-spacing:.3em;color:#7d7760;margin-bottom:5vh;
}
.entries{display:flex;gap:2.2vw;justify-content:center;flex-wrap:wrap;}
.entry{
  display:block;text-decoration:none;
  width:270px;padding:2.6em 1.8em;
  border:.5px solid rgba(200,188,158,.16);
  background:rgba(255,240,205,.012);
  transition:.5s cubic-bezier(.2,.8,.2,1);
  position:relative;
}
.entry:hover{
  border-color:rgba(255,214,150,.42);
  background:rgba(255,225,175,.05);
  transform:translateY(-3px);
  box-shadow:0 12px 40px -18px rgba(255,200,130,.35);
}
.entry .no{
  font-size:10px;letter-spacing:.4em;color:#7c745c;margin-bottom:1.4em;
}
.entry .nm{
  font-size:25px;letter-spacing:.3em;color:#ece2c6;margin-bottom:1em;
}
.entry .ds{
  font-size:12px;line-height:2;color:#948b71;letter-spacing:.06em;
}
.entry .go{
  margin-top:1.8em;font-size:11px;letter-spacing:.3em;color:#8d8060;
  transition:.4s;
}
.entry:hover .go{color:#ffd9a0;}
.foot{
  margin-top:6vh;font-size:10px;letter-spacing:.28em;color:#5f5947;
}
@media (max-width:760px){
  .entries{flex-direction:column;align-items:center;gap:4vh;}
  .entry{width:86vw;padding:2.2em 1.4em;}
  h1{letter-spacing:.3em;}
  .sub{font-size:11px;letter-spacing:.2em;}
  .foot{margin-top:4vh;}
}
</style>
</head>
<body>
<div class="wrap">
  <p class="head">閩 海 關 · 民 國 十 七 年</p>
  <h1>塵 封 檔 案</h1>
  <p class="sub">全 宗 第 叁 柒 號 · 兩 種 呈 現</p>

  <div class="entries">
    <a class="entry" href="plates.html">
      <p class="no">V — A</p>
      <p class="nm">圖 版</p>
      <p class="ds">七份證物，各自的筆跡。<br>墨吃進紙裡，字有脾氣。</p>
      <p class="go">進 入 →</p>
    </a>
    <a class="entry" href="lantern.html">
      <p class="no">V — B</p>
      <p class="nm">提 燈</p>
      <p class="ds">光只照到你手上的地方。<br>其餘，看不見。</p>
      <p class="go">進 入 →</p>
    </a>
  </div>

  <p class="foot">非 授 權 人 員 不 得 開 啟</p>
</div>
</body>
</html>
