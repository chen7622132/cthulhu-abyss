<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080e14">
<title>七重</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#060a0e;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    font-family:"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif;}

  /* ---------- 背景：深海夜雨 ---------- */
  #bg{position:fixed;inset:0;
    background:
      radial-gradient(120% 80% at 50% 0%, #16232c 0%, #0a1218 45%, #05080b 100%);
  }
  #rain{position:fixed;inset:-20%;
    background-image:repeating-linear-gradient(101deg,
      rgba(150,196,214,0) 0px, rgba(150,196,214,0) 7px,
      rgba(150,196,214,0.055) 7px, rgba(150,196,214,0.055) 8px);
    animation:rainmove 1.35s linear infinite;
    opacity:.75;
  }
  @keyframes rainmove{ from{transform:translateY(-120px)} to{transform:translateY(0)} }
  #fog{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(90% 55% at 50% 8%, rgba(120,170,190,0.10) 0%, rgba(0,0,0,0) 60%);}

  /* ---------- 纸 ---------- */
  .sheet{
    position:fixed;
    left:14px; right:14px; top:20px; bottom:76px;
    border-radius:5px;
    background:#e9e1cb;
    background-image:var(--paper);
    background-size:cover;
    background-position:center;
    background-blend-mode:multiply;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.10) inset,
      0 0 0 1px rgba(0,0,0,0.45),
      0 34px 70px rgba(0,0,0,0.55),
      0 12px 26px rgba(0,0,0,0.40),
      0 3px 8px rgba(0,0,0,0.42),
      0 0 0 1px rgba(0,0,0,0.35);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* 纸的四边被压暗一点，像被手指翻过很多次 */
  .sheet::after{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:5px;
    box-shadow:inset 0 0 40px rgba(96,76,44,0.30), inset 0 0 6px rgba(80,60,32,0.25),
               inset 0 -2px 0 rgba(255,248,228,0.20),
               inset 0 -4px 10px rgba(60,44,22,0.35);
  }

  .head{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:8px;
    padding:11px 13px 8px;
  }
  .brand{color:#9a7f3e; font-size:14.5px; letter-spacing:.12em; font-weight:700; white-space:nowrap; flex-shrink:0;}
  .tag{
    font-size:10.5px; color:#6d5f45;
    border:1px solid rgba(110,95,70,0.38);
    border-radius:3px; padding:1.5px 7px; letter-spacing:.10em;
  }
  .close{margin-left:auto; font-size:11.5px; color:#6d5f45; letter-spacing:.06em;}

  .body{position:relative; z-index:2; padding:0 13px; flex:1; display:flex; flex-direction:column; min-height:0;}

  h1{
    margin:2px 0 6px; font-size:21px; letter-spacing:.10em; color:#4a3f2c;
    font-weight:700; display:flex; align-items:baseline; gap:10px;
  }
  h1 small{margin-left:auto;}
  h1 small{font-size:10.5px; font-weight:400; color:#8a7550; letter-spacing:.10em;}
  h1 em{font-style:normal; border-bottom:1px solid rgba(110,95,70,0.30); padding-bottom:2px;}

  .desc{
    font-size:11.5px; line-height:1.85; color:#5d5140; letter-spacing:.03em;
    margin:0 0 9px;
  }
  .desc b{font-weight:700; color:#4a3f2c;}

  /* ---------- 插图 ---------- */
  .art{
    position:relative; border-radius:3px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(40,30,18,0.45), 0 3px 10px rgba(40,30,18,0.28);
    background:#0e1a20;
    flex-shrink:0;
  }
  .art img{display:block; width:100%; height:auto;}
  .art::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 18px rgba(0,0,0,0.55);
  }
  /* 图上的地名，像手写标注 */
  .pin{
    position:absolute; font-size:8.5px; color:rgba(232,218,188,0.62);
    letter-spacing:.14em; text-shadow:0 0 5px rgba(0,0,0,0.95);
  }
  .pin.a{left:9%;  top:74%;}
  .pin.b{left:44%; top:60%;}
  .pin.c{right:8%; top:20%;}

  /* ---------- 地点卡 ---------- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:7px;
    margin-top:9px; flex:1; min-height:0; align-content:start;
  }
  .spot{
    border:1px solid rgba(112,96,68,0.26);
    border-radius:2px;
    padding:6px 7px 7px;
    background:rgba(255,250,236,0.10);
    position:relative;
    min-height:0;
  }
  .spot.on{
    border-color:#8b6a38;
    background:rgba(200,168,104,0.16);
    box-shadow:0 0 0 1px rgba(139,106,56,0.55) inset;
  }
  .spot.on::after{
    content:""; position:absolute; right:5px; top:5px;
    width:5px; height:5px; border-radius:50%;
    background:#a8442c; opacity:.92;
  }
  .spot .nm{
    font-size:12px; color:#463c2b; font-weight:700; letter-spacing:.05em;
    display:flex; align-items:center; gap:4px;
  }
  .spot .nm i{
    font-style:normal; font-size:7px; color:rgba(154,127,62,0.55);
  }
  .spot .tx{
    font-size:9.5px; line-height:1.6; color:#6f6250; margin-top:3px; letter-spacing:.02em;
  }
  .spot.locked .nm{color:#8a7d68;}
  .spot.locked .tx{color:#918572; font-style:italic;}
  /* 已查看过：右上角一枚小方印 */
  .spot.done::before{
    content:"閱"; position:absolute; right:4px; top:3px;
    font-size:7px; color:rgba(168,68,44,0.72);
    border:1px solid rgba(168,68,44,0.46); border-radius:1px;
    padding:0 1.5px; line-height:1.25;
  }
  .spot.done .nm{color:#5b5040;}

  /* ---------- 翻页 ---------- */
  .pager{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:5px 0 7px; font-size:10px; color:#7a6a50; letter-spacing:.08em;
    flex-shrink:0;
  }
  .pager .dot{width:6px; height:6px; border-radius:50%; background:#c0703c; opacity:.85;}
  .pager .dot.off{background:rgba(120,105,80,0.40);}

  /* ---------- 底部导航 ---------- */
  .nav{
    position:fixed; left:0; right:0; bottom:0; height:76px;
    padding-top:16px;
    display:flex; align-items:stretch;
    background:linear-gradient(180deg, rgba(40,32,22,0.99) 0%, rgba(46,37,26,0.99) 22%, rgba(32,26,18,1) 100%);
    border-top:1px solid rgba(150,132,96,0.14);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .ni{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:#8a7856; font-size:8.5px; letter-spacing:.10em;
  }
  .ni svg{width:17px; height:17px; stroke:#a08d6c; stroke-width:1.15; fill:none;
    stroke-linecap:round; stroke-linejoin:round;}
  .ni.on{color:#dcc695;}
  .ni.on svg{stroke:#dcc695;}
</style>
</head>

<div id="rain"></div>
<div id="fog"></div>

<div class="nav">
  <div class="ni"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>冊</div>

<div class="sheet" id="sheet">
  <div class="head">
    <div class="brand">七重</div>
    <div class="tag">測繪冊</div>
    <div class="close">× 合上</div>
  </div>

  <div class="body">
