    var L = LINES[i];
    var fs0 = L.s * u;
    var x0;
    if (L.al === 'c')      x0 = W/2 - textW(L.t, fs0)/2;
    else if (L.al === 'r') x0 = M.right - textW(L.t, fs0);
    else                   x0 = M.left;

    var cx = x0;
    for (var j=0;j<L.t.length;j++){
      var ch = L.t.charAt(j);
      if (ch === '　' || ch === ' '){ cx += fs0*0.60; continue; }

      var fsz = fs0 * (0.972 + rnd(i*13.1+j*7.3)*0.056);
      var dy  = (rnd(i*17.7+j*11.1)-0.5) * fs0 * 0.070;
      var rot = (rnd(i*19.3+j*23.7)-0.5) * 0.016;

      g.save();
      g.translate(cx, y + dy);
      g.rotate(rot);
      g.font = fsz.toFixed(1)+'px '+SERIF;
      if (halo){
        /* 洇开的那一层：墨顺着纸纤维往外爬的一点点 */
        g.fillStyle = 'rgb(32,25,17)';
      } else {
        g.fillStyle = 'rgb(22,16,10)';
        g.globalAlpha = Math.min(1, L.w * (0.90 + rnd(i*29.1+j*31.3)*0.10));
      }
      g.fillText(ch, 0, 0);
      g.restore();

      cx += fsz*1.045 + (rnd(i*37.1+j*41.3)-0.5)*0.9;
    }
    y += L.gap * u * 1.52;
  }
}

function paintInk(g){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  g.textBaseline = 'alphabetic';

  /* 先洇，后压。真实墨迹从来没有一条锐利的边。
     用多遍微偏移累积出晕，不依赖 canvas 的 blur 滤镜。 */
  var offs = [
    [0,0,0.14], [-1.2,0.5,0.10], [1.2,-0.5,0.10],
    [0.6,1.5,0.085], [-0.6,-1.5,0.085],
    [2.0,0,0.055], [-2.0,0,0.055]
  ];
  for (var k=0;k<offs.length;k++){
    g.save();
    g.globalAlpha = offs[k][2];
    g.translate(offs[k][0], offs[k][1]);
    drawLineSet(g, true);
    g.restore();
  }

  drawLineSet(g, false);

  /* 纸纹穿透：墨薄的地方，纸的起伏必须露出来。
     没有这一层，字永远浮在表面。 */
  if (pOk){
    var sc = Math.max(W/paper.width, H/paper.height);
    var dw = paper.width*sc, dh = paper.height*sc;
    var dx = (W-dw)/2, dy = (H-dh)/2;
    g.save();
    g.globalCompositeOperation = 'destination-out';
    g.globalAlpha = 0.15;
    g.filter = 'brightness(0.76) contrast(3.6)';
    g.drawImage(paper, dx, dy, dw, dh);
    g.filter = 'none';
    g.restore();
  }
}

/* ---------- 纸的外形：一张铺在桌上的纸，四个角略微不齐 ---------- */
function paperQuad(){
  return [
    [W*0.064, H*0.052],
    [W*0.948, H*0.040],
    [W*0.957, H*0.946],
    [W*0.056, H*0.959]
  ];
}

function trailEdge(g, a, b, seed){
  var n = 18;
  var nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
  var L = Math.sqrt(nx*nx+ny*ny) || 1; nx /= L; ny /= L;
  for (var i=1;i<n;i++){
    var t = i/n;
    var j = (rnd(seed+i*3.17)-0.5)*1.5;
    if (rnd(seed+i*7.71) > 0.93) j += (rnd(seed+i*11.3)-0.5)*5;
    g.lineTo(a[0]+(b[0]-a[0])*t + nx*j, a[1]+(b[1]-a[1])*t + ny*j);
  }
  g.lineTo(b[0], b[1]);
}

function paperPath(g){
  var q = paperQuad();
  g.beginPath();
  g.moveTo(q[0][0], q[0][1]);
  trailEdge(g, q[0], q[1], 31);
  trailEdge(g, q[1], q[2], 53);
  trailEdge(g, q[2], q[3], 71);
  trailEdge(g, q[3], q[0], 97);
  g.closePath();
}


/* ---------- 印章：方印、朱泥、缺墨 ---------- */
var SEAL = null;
function ensureSeal(){
  if (SEAL) return SEAL;
  var s = 64;
  var c = document.createElement('canvas');
  c.width = c.height = Math.floor(s*DPR);
  var g = c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  g.translate(s/2, s/2);
  g.strokeStyle = 'rgba(150,38,27,0.92)';
  g.fillStyle   = 'rgba(150,38,27,0.92)';
  /* 边框：印泥压下去会抖，不是直线 */
  function sealEdge(a, b, seed, lw){
    var n = 16;
    g.lineWidth = lw;
    g.beginPath();
    for (var i=0;i<=n;i++){
      var t = i/n;
      var jx = (rnd(seed+i*3.7)-0.5)*s*0.013;
      var jy = (rnd(seed+i*7.1)-0.5)*s*0.013;
      var px = a[0]+(b[0]-a[0])*t+jx;
      var py = a[1]+(b[1]-a[1])*t+jy;
      if (i===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.stroke();
  }
  var r1 = s*0.452, r2 = s*0.378;
  sealEdge([-r1,-r1],[ r1,-r1], 11, s*0.048);
  sealEdge([ r1,-r1],[ r1, r1], 23, s*0.050);
  sealEdge([ r1, r1],[-r1, r1], 37, s*0.046);
  sealEdge([-r1, r1],[-r1,-r1], 47, s*0.051);
  sealEdge([-r2,-r2],[ r2,-r2], 53, s*0.014);
  sealEdge([ r2,-r2],[ r2, r2], 61, s*0.015);
  sealEdge([ r2, r2],[-r2, r2], 67, s*0.013);
  sealEdge([-r2, r2],[-r2,-r2], 73, s*0.015);
  g.font = (s*0.275).toFixed(1)+'px '+SERIF;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('沈', -s*0.192, -s*0.190);
  g.fillText('硯',  s*0.192, -s*0.190);
  g.fillText('秋', -s*0.192,  s*0.190);
  g.fillText('印',  s*0.192,  s*0.190);
  /* 印泥不匀：缺的地方是真的缺 */
  g.globalCompositeOperation = 'destination-out';
  for (var i=0;i<85;i++){
    g.globalAlpha = 0.30 + rnd(i*3.13)*0.55;
    var a = rnd(i*7.31)*6.2832, r = rnd(i*11.73)*s*0.56;
    g.beginPath();
    g.arc(Math.cos(a)*r, Math.sin(a)*r, 0.35 + rnd(i*5.91)*s*0.032, 0, 6.2832);
    g.fill();
  }
  SEAL = c;
  return c;
}

/* ---------- 主绘制 ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  if (!pOk) return;

  /* 纸铺满 */
  var sc = Math.max(W/paper.width, H/paper.height);
  var dw = paper.width*sc, dh = paper.height*sc;
  ctx.drawImage(paper, (W-dw)/2, (H-dh)/2, dw, dh);

  /* 字 */
  ensureInk();
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(INK, 0, 0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.restore();

  /* 印：盖在落款旁边，朱泥压在纸上 */
  var sc2 = ensureSeal();
  var sw = 64;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 0.66;
  ctx.translate(W*0.705, H*0.838);
  ctx.rotate(-0.045);
  ctx.drawImage(sc2, -sw/2, -sw/2, sw, sw);
  ctx.restore();

  /* 只在四边压一点，中间不动 */
  var vg = ctx.createRadialGradient(W*0.50, H*0.46, H*0.42, W*0.50, H*0.50, H*0.98);
  vg.addColorStop(0,   'rgba(0,0,0,0)');
  vg.addColorStop(0.66,'rgba(0,0,0,0.14)');
  vg.addColorStop(1,   'rgba(0,0,0,0.78)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

/* ---------- 尺寸 ---------- */
function resize(){
  var r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width  = Math.floor(W*DPR);
  cv.height = Math.floor(H*DPR);
  INK = null;
  draw();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

resize();
setTimeout(resize, 140);

window.__state = function(){ return { W:W, H:H, DPR:DPR, ok:pOk }; };
})();
</script>
