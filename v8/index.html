var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 390, H = 844, DPR = 1;

/* ---------- 确定性随机 ---------- */
function rnd(s){ var x = Math.sin(s*127.1+311.7)*43758.5453; return x - Math.floor(x); }

/* ---------- 尺寸 ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width  = Math.floor(innerWidth * DPR);
  cv.height = Math.floor(innerHeight * DPR);
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  W = 390; H = Math.round(390 * innerHeight / innerWidth);
  draw();
}
addEventListener('resize', resize);

/* ---------- 掀盖状态 ---------- */
var lid = { x:0, y:0, ang:-0.16, open:0 };
var drag = { on:false, id:null, x0:0, y0:0, base:0, locked:0, passed:false, t0:0, lx:0 };

/* 盖子的家 */
var HOME = { x: 142, y: 311, ang: 0.010 };   /* 一开始就盖在函口上 */

/* ============================================================
   线描：所有的东西都用线画，不用色块
   ============================================================ */
var INK = '34,27,18';
var PAPER = '#ded5b9';

/* 排线：一组平行线，用来做阴影 */
function hatch(x, y, w, h, ang, gap, alpha, lw, seed){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.strokeStyle = 'rgba(' + INK + ',' + alpha + ')';
  ctx.lineWidth = lw;
  var diag = Math.sqrt(w*w + h*h) + gap*2;
  var n = Math.ceil(diag / gap);
  for (var i=0;i<n;i++){
    var o = -diag/2 + i*gap + (rnd(seed+i)*0.7);
    ctx.beginPath();
    var cx = x + w/2, cy = y + h/2;
    ctx.moveTo(cx - Math.cos(ang)*diag/2 - Math.sin(ang)*o,
               cy - Math.sin(ang)*diag/2 + Math.cos(ang)*o);
    ctx.lineTo(cx + Math.cos(ang)*diag/2 - Math.sin(ang)*o,
               cy + Math.sin(ang)*diag/2 + Math.cos(ang)*o);
    ctx.stroke();
  }
  ctx.restore();
}

/* 抖线：手工画出来的一条线，会抖 */
function wline(pts, alpha, lw, seed, close){
  ctx.save();
  ctx.strokeStyle = 'rgba(' + INK + ',' + alpha + ')';
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (var i=0;i<pts.length;i++){
    var jx = (rnd(seed+i*3.7)-0.5)*1.1;
    var jy = (rnd(seed+i*7.1)-0.5)*1.1;
    if (i===0) ctx.moveTo(pts[i][0]+jx, pts[i][1]+jy);
    else ctx.lineTo(pts[i][0]+jx, pts[i][1]+jy);
  }
  if (close) ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

/* ---------- 底：照片 ---------- */
var BG = new Image();
var bgReady = false;
BG.onload = function(){ bgReady = true; draw(); };
BG.src = BG64;

/* 照片上石函的位置（按实测微调） */
var BOX = { cx: 0.435, cy: 0.455, mw: 0.235, mh: 0.235 };

function drawTable(){
  if (bgReady){
    var sc = Math.max(W/BG.width, H/BG.height);
    var dw = BG.width*sc, dh = BG.height*sc;
    ctx.drawImage(BG, (W-dw)/2, (H-dh)/2, dw, dh);
  } else {
    ctx.fillStyle = '#1a1610';
    ctx.fillRect(0,0,W,H);
  }

  /* 四角压暗（照片本身有，再补一点） */
  var vg = ctx.createRadialGradient(W*.5,H*.46,H*.20,W*.5,H*.5,H*.92);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.66)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  /* 轻微的纸膜：让它像印在纸上，不像屏幕 */
  ctx.fillStyle = 'rgba(60,50,32,.07)';
  ctx.fillRect(0,0,W,H);
}

/* ---------- 函口：掀开多少，黑口多大 ---------- */
function drawBoxBody(){
  if (lid.open <= 0.02) return;

  var cx = W * BOX.cx, cy = H * BOX.cy;
  var bw = W * BOX.mw, bh = H * BOX.mh;

  /* 口子的宽高随 open 增长 */
  var ow = bw * (0.62 + 0.32 * lid.open);
  var oh = bh * (0.035 + 0.115 * lid.open);

  ctx.save();
  /* 口内：不是纯黑，是分层暗 */
  var g = ctx.createLinearGradient(0, cy-oh*0.5, 0, cy+oh*0.5);
  g.addColorStop(0,   'rgba(3,3,2,0.98)');
  g.addColorStop(0.55,'rgba(14,12,8,0.96)');
  g.addColorStop(1,   'rgba(34,30,22,0.90)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, cy, ow/2, oh/2, 0.01, 0, Math.PI*2);
  ctx.fill();

  /* 口沿：上沿一道受光的细线，下沿一道更亮的线（石材厚边） */
  ctx.strokeStyle = 'rgba(198,188,160,.42)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(cx, cy - 0.6, ow/2, oh/2, 0.01, Math.PI*0.92, Math.PI*2.08);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(240,230,200,.22)';
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1.6, ow/2*1.02, oh/2*1.05, 0.01, Math.PI*0.12, Math.PI*0.88);
  ctx.stroke();

  /* 口内深处的一点点反光：说明它很深 */
  if (lid.open > 0.6){
    var ig = ctx.createRadialGradient(cx, cy + oh*0.12, 1, cx, cy + oh*0.12, ow*0.22);
    ig.addColorStop(0,'rgba(120,108,78,.16)');
    ig.addColorStop(1,'rgba(120,108,78,0)');
    ctx.fillStyle = ig;
    ctx.fillRect(cx-ow*0.3, cy-oh*0.5, ow*0.6, oh*1.2);
  }
  ctx.restore();
}

/* ---------- 盖子：照片里已经有，只补"掀动的痕迹" ---------- */
function drawLid(){
  if (lid.open <= 0.05) return;
  /* 盖子上沿被抬起时，和函体之间裂开的一道暗缝 */
  var cx = W * BOX.cx, cy = H * BOX.cy;
  var bw = W * BOX.mw, bh = H * BOX.mh;

  ctx.save();
  var a = Math.min(1, lid.open * 1.4);
  ctx.strokeStyle = 'rgba(8,7,5,' + (0.55*a).toFixed(2) + ')';
  ctx.lineWidth = 2 + lid.open * 4;
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.52, cy - bh*0.02);
  ctx.quadraticCurveTo(cx, cy - bh*0.10 - lid.open*bh*0.10, cx + bw*0.52, cy - bh*0.02);
  ctx.stroke();

  /* 缝下方一道极淡的受光，说明缝是真的 */
  ctx.strokeStyle = 'rgba(220,210,182,' + (0.20*a).toFixed(2) + ')';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.50, cy + 1.5);
  ctx.quadraticCurveTo(cx, cy - bh*0.09 - lid.open*bh*0.10 + 2, cx + bw*0.50, cy + 1.5);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 颗粒 ---------- */
function grain(){
  for (var i=0;i<160;i++){
    ctx.fillStyle = Math.random()<.5 ? 'rgba(255,252,238,.10)' : 'rgba(96,80,54,.05)';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1.3, 1.3);
  }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  drawTable();
  drawBoxBody();
  drawLid();
  grain();
}

/* ---------- 手势 ---------- */
var LOCK_MS = 220, NEED = 36, MAXPULL = 62;

function hitLid(x,y){
  var lx = HOME.x, ly = HOME.y;
  return Math.abs(x-lx) < 80 && Math.abs(y-ly) < 65;
}

cv.addEventListener('pointerdown', function(e){
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  if (!hitLid(x,y)) return;
  drag.on = true; drag.id = e.pointerId;
  drag.x0 = x; drag.y0 = y;
  drag.base = lid.x;
  drag.locked = 0; drag.passed = false;
  cv.setPointerCapture(e.pointerId);
}, {passive:true});

cv.addEventListener('pointermove', function(e){
  if (!drag.on || e.pointerId !== drag.id) return;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left;

  var want = drag.base + (x - drag.x0) * 0.9;
  var barrier = MAXPULL * 0.60;

  if (!drag.passed){
    if (want >= barrier){
      var now = Date.now();
      if (!drag.locked){
        drag.locked = now + LOCK_MS;
        lid.x = barrier;
        draw();
        return;
      }
      if (now < drag.locked){ lid.x = barrier; draw(); return; }
      if (want > barrier + NEED){
        drag.passed = true; drag.locked = 0;
      } else {
        lid.x = barrier; draw(); return;
      }
    } else {
      lid.x = Math.max(0, want);
      lid.open = Math.min(1, lid.x / MAXPULL);
      draw();
      return;
    }
  }
  lid.x = Math.max(0, Math.min(MAXPULL, want));
  lid.open = Math.min(1, lid.x / MAXPULL);
  draw();
}, {passive:true});

function endDrag(e, cancelled){
  if (!drag.on) return;
  drag.on = false;
  var wasPassed = drag.passed;
  drag.passed = false; drag.locked = 0;

  if (wasPassed || lid.open > 0.5){
    /* 掀开：停在开的位置 */
    lid.open = 1; lid.x = MAXPULL;
    document.getElementById('tip').style.opacity = '0';
  } else {
    /* 回弹 */
    var back = function(){
      lid.open *= 0.72; lid.x *= 0.72;
      if (lid.open < 0.02){ lid.open = 0; lid.x = 0; draw(); return; }
      draw(); requestAnimationFrame(back);
    };
    back();
  }
  draw();
}

cv.addEventListener('pointerup', function(e){ endDrag(e,false); }, {passive:true});
cv.addEventListener('pointercancel', function(e){
  endDrag(e,true); lid.open = 0; lid.x = 0; draw();
}, {passive:true});
cv.addEventListener('lostpointercapture', function(e){
  if (drag.on){ drag.on = false; drag.locked = 0; }
}, {passive:true});

window.__open = function(k){ lid.open = k; lid.x = MAXPULL*k; draw(); };

resize();
})();
</script>
