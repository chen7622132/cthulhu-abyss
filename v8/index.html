function paintCover(img, ok){
  if (!ok){ ctx.fillStyle = '#0a0908'; ctx.fillRect(0,0,W,H); return; }
  var sc = Math.max(W/img.width, H/img.height);
  var dw = img.width*sc, dh = img.height*sc;
  ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
}

/* 七个字：刻在内侧石面上 */
/* ============================================================
   石刻字：先画字，再对像素做位移扰动，边缘就毛了
   ============================================================ */
var MASK = {}, TINT = {};

function carvedMask(ch){
  if (MASK[ch]) return MASK[ch];
  var S = 52;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var x = c.getContext('2d');
  x.font = '37px "Kaiti SC","STKaiti","KaiTi","Songti SC",serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillStyle = '#fff';
  x.fillText(ch, S/2, S/2);

  var src = x.getImageData(0,0,S,S);
  var out = x.createImageData(S,S);
  var k = ch.charCodeAt(0);

  for (var py=0; py<S; py++){
    for (var px=0; px<S; px++){
      var i = (py*S+px)*4;
      if (src.data[i+3] < 8){ out.data[i+3] = 0; continue; }
      /* 位移：低频起伏（像刀走歪）+ 高频噪点（像石粒崩掉） */
      var nx = Math.sin(px*0.62 + py*0.91 + k*0.13)*1.25
             + (rnd(px*3.1 + py*7.7 + k) - 0.5) * 2.6;
      var ny = Math.cos(py*0.57 + px*0.83 + k*0.29)*1.25
             + (rnd(px*11.3 + py*5.9 + k) - 0.5) * 2.6;
      var sx = Math.max(0, Math.min(S-1, Math.round(px + nx)));
      var sy = Math.max(0, Math.min(S-1, Math.round(py + ny)));
      var j = (sy*S+sx)*4;
      out.data[i]   = src.data[j];
      out.data[i+1] = src.data[j+1];
      out.data[i+2] = src.data[j+2];
      out.data[i+3] = src.data[j+3];
    }
  }
  var c2 = document.createElement('canvas');
  c2.width = S; c2.height = S;
  c2.getContext('2d').putImageData(out, 0, 0);
  MASK[ch] = c2;
  return c2;
}

function tintMask(ch, color){
  var key = ch + '|' + color;
  if (TINT[key]) return TINT[key];
  var m = carvedMask(ch);
  var c = document.createElement('canvas');
  c.width = m.width; c.height = m.height;
  var x = c.getContext('2d');
  x.drawImage(m, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color;
  x.fillRect(0, 0, c.width, c.height);
  TINT[key] = c;
  return c;
}

function carve(){
  var chars = ['启','者','代','我','守','此','函'];
  var cx = W * 0.505;
  var y0 = H * 0.235, y1 = H * 0.685;
  var step = (y1-y0)/6;
  var S = 52, D = 24;          /* 遮罩尺寸 / 半个 */

  for (var i=0;i<7;i++){
    var cy = y0 + step*i;
    var clear = (i < 2);

    ctx.save();
    ctx.translate(cx + (rnd(i*3.1)-0.5)*2.2, cy + (rnd(i*9.7)-0.5)*2.0);
    ctx.rotate((rnd(i*7.3)-0.5)*0.075);
    var sc = 0.90 + rnd(i*11.3)*0.20;
    ctx.scale(sc, sc);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (clear){
      var m = carvedMask(chars[i]);
      /* ① 凹陷：整块压暗（上偏一点，因为光从左上来） */
      ctx.globalAlpha = 0.66;
      ctx.drawImage(tintMask(chars[i], '#0a0805'), -D, -D+0.8, S, S);
      /* ② 内芯再压一层 */
      ctx.globalAlpha = 0.34;
      ctx.drawImage(tintMask(chars[i], '#050403'), -D-0.5, -D-0.7, S, S);
      /* ③ 下缘一线受光 —— 这是"刻"的全部秘密 */
      ctx.globalAlpha = 0.40;
      ctx.drawImage(tintMask(chars[i], '#efe6c8'), -D+0.7, -D+2.0, S, S);
      ctx.globalAlpha = 1;
    } else {
      /* 磨平：一团凹 + 上沿一线亮 + 两截断笔 */
      var g2 = ctx.createRadialGradient(0, 0.5, 0.5, 0, 0, 7.6);
      g2.addColorStop(0,   'rgba(11,9,6,.44)');
      g2.addColorStop(0.62,'rgba(17,14,10,.20)');
      g2.addColorStop(1,   'rgba(17,14,10,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.ellipse(0, 0.5, 7.0, 8.2, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(230,222,194,.22)';
      ctx.lineWidth = 1.0;
      ctx.beginPath();
      ctx.moveTo(-5.0, 6.4);
      ctx.quadraticCurveTo(0, 7.0, 5.2, 6.0);
      ctx.stroke();

      for (var r2=0;r2<2;r2++){
        ctx.strokeStyle = 'rgba(205,196,168,.09)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        var rx = (rnd(i*31+r2*7)-0.5)*8.5;
        ctx.moveTo(rx, -3.5 + r2*3.8);
        ctx.lineTo(rx + 2.4, -1.2 + r2*3.8);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function grain(){
  for (var i=0;i<130;i++){
    ctx.fillStyle = Math.random()<.5 ? 'rgba(255,250,232,.055)' : 'rgba(0,0,0,.055)';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1.2, 1.2);
  }
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  /* 翻到一半时，画面被横向压扁 */
  var k = Math.abs(Math.cos(flip * Math.PI));   /* 1 -> 0 -> 1 */
  var showingB = (flip >= 0.5);

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(Math.max(0.02, k), 1);
  ctx.translate(-W/2, -H/2);

  if (showingB){
    paintCover(imgB, bOk);
    if (bOk) carve();
  } else {
    paintCover(imgA, aOk);
  }
  ctx.restore();

  /* 翻转接缝：一条竖亮线，随 k 变窄变亮 */
  if (k < 0.985){
    var lw = Math.max(1, (1-k) * 26);
    var g = ctx.createLinearGradient(W/2 - lw, 0, W/2 + lw, 0);
    g.addColorStop(0,   'rgba(0,0,0,0)');
    g.addColorStop(0.42,'rgba(0,0,0,' + (0.55*flip).toFixed(2) + ')');
    g.addColorStop(0.5, 'rgba(226,216,186,' + (0.30*(1-k)).toFixed(2) + ')');
    g.addColorStop(0.58,'rgba(0,0,0,' + (0.55*flip).toFixed(2) + ')');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(W/2 - lw, 0, lw*2, H);
  }

  /* 暗角 */
  var vg = ctx.createRadialGradient(W*.5,H*.46,H*.20,W*.5,H*.5,H*.92);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  grain();
}

/* ---------- 手势：按住盖子，往下拖 = 翻 ---------- */
var g = { on:false, id:null, y0:0, base:0 };

function hitLid(x,y){
  var nx = x/W, ny = y/H;
  return nx > 0.34 && nx < 0.76 && ny > 0.22 && ny < 0.66;
}

cv.addEventListener('pointerdown', function(e){
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  if (!hitLid(x,y)) return;
  g.on = true; g.id = e.pointerId; g.y0 = y; g.base = flip;
  cv.setPointerCapture(e.pointerId);
  document.getElementById('tip').style.opacity = '0';
}, {passive:true});

cv.addEventListener('pointermove', function(e){
  if (!g.on || e.pointerId !== g.id) return;
  var r = cv.getBoundingClientRect();
  var y = e.clientY - r.top;
  var want = g.base + (y - g.y0) / (H * 0.30);
  flip = Math.max(0, Math.min(1, want));
  draw();
}, {passive:true});

function endFlip(){
  if (!g.on) return;
  g.on = false;
  /* 过半就翻过去，否则弹回 */
  var target = (flip > 0.5) ? 1 : 0;
  (function anim(){
    flip += (target - flip) * 0.22;
    if (Math.abs(target - flip) < 0.006){ flip = target; draw(); return; }
    draw(); requestAnimationFrame(anim);
  })();
}
cv.addEventListener('pointerup', function(e){ endFlip(); }, {passive:true});
cv.addEventListener('pointercancel', function(e){ g.on=false; flip=0; draw(); }, {passive:true});

window.__flip = function(v){ flip = v; draw(); };

resize();
})();
</script>
