/* 逐字手写：大小、基线、角度都偏 */
function handText(txt, x, y, size, alpha, seed){
  var cx = x;
  for (var k=0;k<txt.length;k++){
    var ch = txt.charAt(k);
    if (ch === '　' || ch === ' '){ cx += size * 0.66; continue; }
    var fs  = size * (0.90 + rnd(seed + k*3.1) * 0.20);
    var dy  = (rnd(seed + k*7.3) - 0.5) * size * 0.13;
    var rot = (rnd(seed + k*11.7) - 0.5) * 0.075;
    var al  = alpha * (0.86 + rnd(seed + k*13.9) * 0.22);
    ctx.save();
    ctx.translate(cx, y + dy);
    ctx.rotate(rot);
    ctx.font = fs.toFixed(1) + 'px ' + KAI;
    ctx.fillStyle = 'rgba(22,18,12,' + Math.min(1, al).toFixed(2) + ')';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
    cx += fs * 1.04 + (rnd(seed + k*17.3) - 0.5) * 0.8;
  }
}

function drawDoc(){
  /* 纸 */
  ctx.fillStyle = '#d9cfae';
  ctx.fillRect(0,0,W,H);

  /* 蓝格：竖线 + 横线，都有一点抖 */
  var colW = (W - 56) / 9;
  ctx.save();
  ctx.strokeStyle = 'rgba(96,112,146,.30)';
  ctx.lineWidth = 0.8;
  for (var i=0;i<=9;i++){
    var x = 28 + i*colW;
    ctx.beginPath();
    for (var y=0;y<=H;y+=26){
      var jx = (rnd(i*13+y*0.3)-0.5)*0.7;
      if (y===0) ctx.moveTo(x+jx, y); else ctx.lineTo(x+jx, y);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(96,112,146,.20)';
  for (var y2=84;y2<H;y2+=colW*0.92){
    ctx.beginPath();
    for (var x2=0;x2<=W;x2+=30){
      var jy = (rnd(y2*0.7+x2*0.2)-0.5)*0.7;
      if (x2===0) ctx.moveTo(x2, y2+jy); else ctx.lineTo(x2, y2+jy);
    }
    ctx.stroke();
  }
  ctx.restore();

  /* 纸的纤维 */
  for (var f=0;f<700;f++){
    ctx.fillStyle = rnd(f*3) < .5 ? 'rgba(120,104,74,.05)' : 'rgba(255,252,240,.14)';
    ctx.fillRect(rnd(f*7)*W, rnd(f*11)*H, 1.2, 1.2);
  }

  /* 正文 */
  var y0 = 132;
  for (var d=0; d<DOC.length; d++){
    var it = DOC[d];
    if (it.y) y0 = it.y + 40;
    if (it.t){
      handText(it.t, 42, y0, it.s, it.ink, d*37 + 5);
    }
    y0 += it.gap;
  }

  /* 右下角的时间戳：盖章，不是手写 */
  ctx.save();
  ctx.translate(W - 96, H - 116);
  ctx.rotate(-0.03);
  ctx.strokeStyle = 'rgba(126,52,30,.40)';
  ctx.lineWidth = 1.1;
  ctx.strokeRect(0,0,76,26);
  ctx.font = '12px ' + SERIF;
  ctx.fillStyle = 'rgba(126,52,30,.52)';
  ctx.fillText('收到　四月十一', 5, 17);
  ctx.restore();

  /* 四角压暗 */
  var vg = ctx.createRadialGradient(W*.5,H*.46,H*.26,W*.5,H*.5,H*.94);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(30,22,10,.42)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  /* 颗粒 */
  for (var g=0;g<160;g++){
    ctx.fillStyle = Math.random()<.5 ? 'rgba(255,250,232,.07)' : 'rgba(80,64,40,.05)';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1.2, 1.2);
  }
}

   第 2 页：石函
   ============================================================ */
function paintCover(img, ok){
  if (!ok){ ctx.fillStyle = '#0a0908'; ctx.fillRect(0,0,W,H); return; }
  var sc = Math.max(W/img.width, H/img.height);
  VIEW.dw = img.width*sc;
  VIEW.dh = img.height*sc;
  VIEW.ox = (W - VIEW.dw)/2;
  VIEW.oy = (H - VIEW.dh)/2;
  VIEW.ok = true;
  ctx.drawImage(img, VIEW.ox, VIEW.oy, VIEW.dw, VIEW.dh);
}

/* 石刻字：像素位移，边缘就毛了 */
var MASK = {}, TINT = {};
function carvedMask(ch){
  if (MASK[ch]) return MASK[ch];
  var S = 52;
  var c = document.createElement('canvas'); c.width = S; c.height = S;
  var x = c.getContext('2d');
  x.font = '37px ' + KAI;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#fff';
  x.fillText(ch, S/2, S/2);
  var src = x.getImageData(0,0,S,S);
  var out = x.createImageData(S,S);
  var k = ch.charCodeAt(0);
  for (var py=0; py<S; py++) for (var px=0; px<S; px++){
    var i = (py*S+px)*4;
    if (src.data[i+3] < 8){ out.data[i+3] = 0; continue; }
    var nx = Math.sin(px*0.62 + py*0.91 + k*0.13)*1.25 + (rnd(px*3.1+py*7.7+k)-0.5)*2.6;
    var ny = Math.cos(py*0.57 + px*0.83 + k*0.29)*1.25 + (rnd(px*11.3+py*5.9+k)-0.5)*2.6;
    var sx2 = Math.max(0, Math.min(S-1, Math.round(px+nx)));
    var sy2 = Math.max(0, Math.min(S-1, Math.round(py+ny)));
    var j = (sy2*S+sx2)*4;
    out.data[i]=src.data[j]; out.data[i+1]=src.data[j+1]; out.data[i+2]=src.data[j+2]; out.data[i+3]=src.data[j+3];
  }
  var c2 = document.createElement('canvas'); c2.width=S; c2.height=S;
  c2.getContext('2d').putImageData(out,0,0);
  MASK[ch] = c2; return c2;
}
function tintMask(ch, color){
  var key = ch+'|'+color;
  if (TINT[key]) return TINT[key];
  var m = carvedMask(ch);
  var c = document.createElement('canvas'); c.width=m.width; c.height=m.height;
  var x = c.getContext('2d');
  x.drawImage(m,0,0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color;
  x.fillRect(0,0,c.width,c.height);
  TINT[key] = c; return c;
}

function carveText(){
  var chars = ['启','者','代','我','守','此','函'];
  var cx = VIEW.ox + VIEW.dw * 0.505;
  var y0 = VIEW.oy + VIEW.dh * 0.215;
  var y1 = VIEW.oy + VIEW.dh * 0.665;
  var step = (y1-y0)/6;
  var S = 52, D = 24;

  for (var i=0;i<7;i++){
    var cy = y0 + step*i;
    var clear = (i < 2);
    ctx.save();
    ctx.translate(cx + (rnd(i*3.1)-0.5)*2.2, cy + (rnd(i*9.7)-0.5)*2.0);
    ctx.rotate((rnd(i*7.3)-0.5)*0.075);
    var sc = 0.90 + rnd(i*11.3)*0.20;
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    if (clear){
      ctx.globalAlpha = 0.66;
      ctx.drawImage(tintMask(chars[i], '#0a0805'), -D, -D+0.8, S, S);
      ctx.globalAlpha = 0.34;
      ctx.drawImage(tintMask(chars[i], '#050403'), -D-0.5, -D-0.7, S, S);
      ctx.globalAlpha = 0.40;
      ctx.drawImage(tintMask(chars[i], '#efe6c8'), -D+0.7, -D+2.0, S, S);
      ctx.globalAlpha = 1;
    } else {
      /* ① 一块明确的凹：比周围深 */
      var g2 = ctx.createRadialGradient(0,0.5,0.4,0,0,8.2);
      g2.addColorStop(0,   'rgba(8,7,5,.62)');
      g2.addColorStop(0.55,'rgba(12,10,7,.38)');
      g2.addColorStop(1,   'rgba(14,12,8,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.ellipse(0,0.5,7.8,9.0,0,0,Math.PI*2); ctx.fill();

      /* ② 凹的内沿：上沿暗、下沿亮 —— 这样才是"陷进去" */
      ctx.strokeStyle = 'rgba(6,5,3,.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0.2, 7.6, 8.8, 0, Math.PI*1.05, Math.PI*1.95);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(232,224,196,.34)';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.ellipse(0, 1.4, 7.6, 8.8, 0, Math.PI*0.12, Math.PI*0.88);
      ctx.stroke();

      /* ③ 凹里两截残笔：看得出"原本有笔画" */
      for (var r2=0;r2<3;r2++){
        ctx.strokeStyle = 'rgba(198,188,160,' + (0.12 + r2*0.03).toFixed(2) + ')';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        var rx = (rnd(i*31 + r2*7) - 0.5) * 9.5;
        var ry = (rnd(i*41 + r2*11) - 0.5) * 10;
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx + 2.8, ry + 1.6);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawBox(){
  var k = Math.abs(Math.cos(flip * Math.PI));
  var showingB = (flip >= 0.5);

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(Math.max(0.02, k), 1);
  ctx.translate(-W/2, -H/2);
  if (showingB){
    paintCover(imgB, bOk);
    if (bOk) carveText();
  } else {
    paintCover(imgA, aOk);
  }
  ctx.restore();

  if (k < 0.985){
    var lw = Math.max(1, (1-k) * 26);
    var g = ctx.createLinearGradient(W/2-lw, 0, W/2+lw, 0);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(0.42,'rgba(0,0,0,' + (0.55*flip).toFixed(2) + ')');
    g.addColorStop(0.5,'rgba(226,216,186,' + (0.30*(1-k)).toFixed(2) + ')');
    g.addColorStop(0.58,'rgba(0,0,0,' + (0.55*flip).toFixed(2) + ')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(W/2-lw, 0, lw*2, H);
  }

  var vg = ctx.createRadialGradient(W*.5,H*.46,H*.20,W*.5,H*.5,H*.92);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  for (var i=0;i<130;i++){
    ctx.fillStyle = Math.random()<.5 ? 'rgba(255,250,232,.055)' : 'rgba(0,0,0,.055)';
    ctx.fillRect(Math.random()*W, Math.random()*H, 1.2, 1.2);
  }
}

/* ============================================================
   转场 + 主绘制
   ============================================================ */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  if (page === 0){
    drawDoc();
  } else {
    drawBox();
  }

  /* 翻页转场：向下推走 */
  if (PAGE_TRANS > 0 && PAGE_TRANS < 1){
    var t = PAGE_TRANS;
    var off = PAGE_DIR > 0 ? -H*t : H*t;
    ctx.fillStyle = 'rgba(0,0,0,' + (0.85*Math.sin(t*Math.PI)).toFixed(2) + ')';
    ctx.fillRect(0,0,W,H);
  }

  updateTip();
}

function updateTip(){
  if (page === 0) tip.textContent = '上滑　翻頁';
  else if (flip < 0.02) tip.textContent = '按住石函　往下拖';
  else tip.textContent = '上滑　翻頁';
}

/* ============================================================
   手势
   ============================================================ */
var g = { on:false, id:null, x0:0, y0:0, base:0, mode:null };

function hitBox(x, y){
  if (!VIEW.ok) return true;
  var u = (x - VIEW.ox) / VIEW.dw;
  var v = (y - VIEW.oy) / VIEW.dh;
  return u > 0.30 && u < 0.80 && v > 0.18 && v < 0.70;
}

cv.addEventListener('pointerdown', function(e){
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  g.on = true; g.id = e.pointerId;
  g.x0 = x; g.y0 = y; g.base = flip;
  g.mode = (page === 1 && hitBox(x, y)) ? 'flip' : 'page';
  if (g.mode === 'flip') cv.setPointerCapture(e.pointerId);
}, {passive:true});

cv.addEventListener('pointermove', function(e){
  if (!g.on || e.pointerId !== g.id) return;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;

  if (g.mode === 'flip'){
    var want = g.base + (y - g.y0) / (H * 0.28);
    flip = Math.max(0, Math.min(1, want));
    draw();
  }
}, {passive:true});

cv.addEventListener('pointerup', function(e){
  if (!g.on) return;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var dx = x - g.x0, dy = y - g.y0;

  if (g.mode === 'flip'){
    var target = (flip > 0.5) ? 1 : 0;
    (function anim(){
      flip += (target - flip) * 0.22;
      if (Math.abs(target - flip) < 0.006){ flip = target; draw(); return; }
      draw(); requestAnimationFrame(anim);
    })();
  } else {
    /* 上滑翻页 */
    if (dy < -70 && Math.abs(dy) > Math.abs(dx)){
      if (page === 0){ goPage(1, 1); }
    }
  }
  g.on = false;
}, {passive:true});

cv.addEventListener('pointercancel', function(){
  g.on = false;
  if (g.mode === 'flip'){ flip = 0; draw(); }
}, {passive:true});

function goPage(n, dir){
  PAGE_DIR = dir; PAGE_TRANS = 0.001;
  var t0 = performance.now();
  (function anim(){
    var p = Math.min(1, (performance.now()-t0)/420);
    PAGE_TRANS = p;
    if (p >= 0.5 && page !== n){ page = n; }
    draw();
    if (p < 1) requestAnimationFrame(anim);
    else { PAGE_TRANS = 0; draw(); }
  })();
}

/* 低频呼吸 */
setInterval(function(){ if (page === 1 && flip < 0.02) draw(); }, 200);

window.__state = function(){ return { page:page, flip:flip.toFixed(2), view:VIEW }; };
window.__go = function(n){ page = n; draw(); };
window.__flip = function(v){ flip = v; draw(); };

resize();
setTimeout(resize, 120);
})();
</script>
</body>
