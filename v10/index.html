/* ---------- 正文 ---------- */
var LINES = [
  { t:'霞浦北鄉　白雲庵　後山',     s:19, w:0.86, gap:46, al:'c' },
  { t:'民國二十三年　四月　十一日', s:12.5,w:0.62, gap:54, al:'c' },
  { t:'本日掘至四尺，得石函一具。',        s:15, w:0.90, gap:30, al:'l' },
  { t:'函長一尺二寸，廣八寸，高一尺。盝頂。', s:13.5,w:0.88, gap:26, al:'l' },
  { t:'四角有鎖，鎖已鏽。',               s:13.5,w:0.88, gap:40, al:'l' },
  { t:'函體完好。鎖扣未動。',             s:17, w:1.00, gap:28, al:'l' },
  { t:'周圍土層無擾動。',                 s:17, w:1.00, gap:46, al:'l' },
  { t:'匠人云：此石非本地所產。',         s:13.5,w:0.86, gap:40, al:'l' },
  { t:'記此。',                           s:15, w:0.90, gap:56, al:'l' },
  { t:'測繪員　沈硯秋　記',               s:13.8,w:0.98, gap:0,  al:'r' }
];

function docMetrics(){
  var u = W/390;
  return { u:u, left:W*0.135, right:W*0.862, top:H*0.158 };
}

function textW(txt, fs){
  var w = 0;
  for (var i=0;i<txt.length;i++){
    var c = txt.charAt(i);
    w += (c==='　'||c===' ') ? fs*0.60 : fs*1.045;
  }
  return w;
}

/* ---------- 墨层：黑字，最后用 multiply 压进纸里 ---------- */
var INK = null, ictx = null;

function ensureInk(){
  var w = Math.floor(W*DPR), h = Math.floor(H*DPR);
  if (INK && INK.width===w && INK.height===h) return;
  INK = document.createElement('canvas');
  INK.width = w; INK.height = h;
  ictx = INK.getContext('2d');
  paintInk(ictx);
}

function drawLineSet(g, halo){
  var M = docMetrics();
  var u = M.u;
  var y = H * 0.172;

  for (var i=0;i<LINES.length;i++){
    var L = LINES[i];
    var fs0 = L.s * u;
    var x0;
    if (L.al === 'c')      x0 = W/2 - textW(L.t, fs0)/2;
    else if (L.al === 'r') x0 = M.right - textW(L.t, fs0);
    else                   x0 = M.left;

    var cx = x0;
    for (var j=0;j<L.t.length;j++){
      var ch = L.t.charAt(j);
      if (ch === '　' || ch === ' '){ cx += fs0*0.60; continue; }

      var fsz = fs0 * (0.972 + rnd(i*13.1+j*7.3)*0.056);
      var dy  = (rnd(i*17.7+j*11.1)-0.5) * fs0 * 0.070;
      var rot = (rnd(i*19.3+j*23.7)-0.5) * 0.016;

      g.save();
      g.translate(cx, y + dy);
      g.rotate(rot);
      g.font = fsz.toFixed(1)+'px '+SERIF;
      if (halo){
        /* 洇开的那一层：墨顺着纸纤维往外爬的一点点 */
        g.fillStyle = 'rgb(32,25,17)';
      } else {
        g.fillStyle = 'rgb(24,19,13)';
        g.globalAlpha = Math.min(1, L.w * (0.90 + rnd(i*29.1+j*31.3)*0.10));
      }
      g.fillText(ch, 0, 0);
      g.restore();

      cx += fsz*1.045 + (rnd(i*37.1+j*41.3)-0.5)*0.9;
    }
    y += L.gap * u * 1.52;
  }
}

function paintInk(g){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,W,H);
  g.textBaseline = 'alphabetic';

  /* 先洇，后压。真实墨迹从来没有一条锐利的边。
     用多遍微偏移累积出晕，不依赖 canvas 的 blur 滤镜。 */
  var offs = [
    [0,0,0.14], [-1.2,0.5,0.10], [1.2,-0.5,0.10],
    [0.6,1.5,0.085], [-0.6,-1.5,0.085],
    [2.0,0,0.055], [-2.0,0,0.055]
  ];
  for (var k=0;k<offs.length;k++){
    g.save();
    g.globalAlpha = offs[k][2];
    g.translate(offs[k][0], offs[k][1]);
    drawLineSet(g, true);
    g.restore();
  }

  drawLineSet(g, false);

  /* 纸纹穿透：墨薄的地方，纸的起伏必须露出来。
     没有这一层，字永远浮在表面。 */
  if (pOk){
    var sc = Math.max(W/paper.width, H/paper.height);
    var dw = paper.width*sc, dh = paper.height*sc;
    var dx = (W-dw)/2, dy = (H-dh)/2;
    g.save();
    g.globalCompositeOperation = 'destination-out';
    g.globalAlpha = 0.15;
    g.filter = 'brightness(0.76) contrast(3.6)';
    g.drawImage(paper, dx, dy, dw, dh);
    g.filter = 'none';
    g.restore();
  }
}

/* ---------- 纸的外形：一张铺在桌上的纸，四个角略微不齐 ---------- */
function paperQuad(){
  return [
    [W*0.064, H*0.052],
    [W*0.948, H*0.040],
    [W*0.957, H*0.946],
    [W*0.056, H*0.959]
  ];
}

function trailEdge(g, a, b, seed){
  var n = 18;
  var nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
  var L = Math.sqrt(nx*nx+ny*ny) || 1; nx /= L; ny /= L;
  for (var i=1;i<n;i++){
    var t = i/n;
    var j = (rnd(seed+i*3.17)-0.5)*1.5;
    if (rnd(seed+i*7.71) > 0.93) j += (rnd(seed+i*11.3)-0.5)*5;
    g.lineTo(a[0]+(b[0]-a[0])*t + nx*j, a[1]+(b[1]-a[1])*t + ny*j);
  }
  g.lineTo(b[0], b[1]);
}

function paperPath(g){
  var q = paperQuad();
  g.beginPath();
  g.moveTo(q[0][0], q[0][1]);
  trailEdge(g, q[0], q[1], 31);
  trailEdge(g, q[1], q[2], 53);
  trailEdge(g, q[2], q[3], 71);
  trailEdge(g, q[3], q[0], 97);
  g.closePath();
}

/* ---------- 主绘制：明亮版 ---------- */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,H);
  if (!pOk) return;

  /* 纸铺满 */
  var sc = Math.max(W/paper.width, H/paper.height);
  var dw = paper.width*sc, dh = paper.height*sc;
  ctx.drawImage(paper, (W-dw)/2, (H-dh)/2, dw, dh);

  /* 字 */
  ensureInk();
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(INK, 0, 0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.restore();

  /* 只在四边压一点，中间不动 */
  var vg = ctx.createRadialGradient(W*0.50, H*0.46, H*0.42, W*0.50, H*0.50, H*0.98);
  vg.addColorStop(0,   'rgba(0,0,0,0)');
  vg.addColorStop(0.72,'rgba(0,0,0,0.08)');
  vg.addColorStop(1,   'rgba(0,0,0,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

/* ---------- 尺寸 ---------- */
function resize(){
  var r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width  = Math.floor(W*DPR);
  cv.height = Math.floor(H*DPR);
  INK = null;
  draw();
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

resize();
setTimeout(resize, 140);

window.__state = function(){ return { W:W, H:H, DPR:DPR, ok:pOk }; };
