<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>七重</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

var cv  = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 390, H = 844, DPR = 1;

function rnd(s){ var x = Math.sin(s*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

var SERIF = '"Songti SC","Noto Serif CJK SC","STSong","SimSun",serif';
var MONO  = '"Courier New","SF Mono",Menlo,monospace';
var AMBER = '246,204,148';
var AMBER2= '214,168,116';

/* ============================================================
   一件器物：盝顶石函
   ============================================================ */
var cam = { ry:0.62, rx:0.30, dist:3.05, scale:1 };
var spin = { vx:0, vy:0 };

function makeBox(w, h, d, cap){
  /* 盝顶石函：直壁 → 檐口外伸 → 斜坡收到平顶 */
  var e  = 0.036;                      /* 出檐伸出的量 */
  var cw = w + e, cd = d + e;
  var ry0 = h*0.40;                    /* 檐口高度（直壁顶） */
  var ty  = h;                         /* 平顶高度 */
  var tw  = w*0.64, td = d*0.64;

  var V = [
    /* 0-3 底 */
    [-w,-h,-d],[ w,-h,-d],[ w,-h, d],[-w,-h, d],
    /* 4-7 直壁顶（檐口内沿） */
    [-w, ry0,-d],[ w, ry0,-d],[ w, ry0, d],[-w, ry0, d],
    /* 8-11 檐外沿 */
    [-cw, ry0,-cd],[ cw, ry0,-cd],[ cw, ry0, cd],[-cw, ry0, cd],
    /* 12-15 平顶 */
    [-tw, ty,-td],[ tw, ty,-td],[ tw, ty, td],[-tw, ty, td]
  ];
  var E = [
    [0,1],[1,2],[2,3],[3,0],           /* 底 */
    [0,4],[1,5],[2,6],[3,7],           /* 直壁竖棱 */
    [4,5],[5,6],[6,7],[7,4],           /* 檐口内沿 */
    [4,8],[5,9],[6,10],[7,11],         /* 檐，水平往外伸 */
    [8,9],[9,10],[10,11],[11,8],       /* 檐外沿 */
    [8,12],[9,13],[10,14],[11,15],     /* 斜坡 */
    [12,13],[13,14],[14,15],[15,12]    /* 平顶 */
  ];
  return { V:V, E:E, cap:cap, w:w, h:h, d:d, cw:cw, cd:cd, ry0:ry0 };
}

var OUTER = makeBox(0.56, 0.38, 0.38, 'outer');
var INNER = makeBox(0.38, 0.24, 0.25, 'inner');
var INNER2= makeBox(0.23, 0.15, 0.16, 'inner2');

/* ---------- 投影 ---------- */
var PX = 0, PY = 0, PS = 1;

function project(p, lift){
  var x = p[0], y = p[1] + (lift||0), z = p[2];
  var cy = Math.cos(cam.ry), sy = Math.sin(cam.ry);
  var x1 =  x*cy - z*sy;
  var z1 =  x*sy + z*cy;
  var cx = Math.cos(cam.rx), sx = Math.sin(cam.rx);
  var y1 =  y*cx - z1*sx;
  var z2 =  y*sx + z1*cx;
  var k = cam.dist / (cam.dist + z2);
  return [PX + x1*k*PS, PY + y1*k*PS, z2, k];
}

/* ---------- 画一个箱体 ---------- */
function drawBox(b, lift, alpha, lw, glow){
  var top = [], bot = [];
  for (var i=0;i<b.E.length;i++){
    var a = b.E[i][0], c = b.E[i][1];
    /* 盖子：顶点 4-11 抬起来 */
    var la = (a >= 4) ? lift : 0;
    var lc = (c >= 4) ? lift : 0;
    var pa = project(b.V[a], la);
    var pc = project(b.V[c], lc);
    var zavg = (pa[2] + pc[2]) / 2;
    (zavg < 0 ? top : bot).push([pa, pc, zavg]);
  }
  function paint(list, mul){
    for (var i=0;i<list.length;i++){
      var pa = list[i][0], pc = list[i][1];
      var k = list[i][2];
      var aa = alpha * mul * clamp(1 - (k + b.d)*0.22, 0.35, 1);
      var midY = (pa[1]+pc[1])*0.5;
      var inScan = Math.abs(midY - scanY) < 17;
      if (inScan) aa = Math.min(1, aa*2.1 + 0.15);
      ctx.strokeStyle = inScan ? 'rgba(255,246,224,'+aa.toFixed(3)+')'
                               : 'rgba('+AMBER+','+aa.toFixed(3)+')';
      ctx.lineWidth = inScan ? lw*2.0 : lw;
      ctx.beginPath();
      ctx.moveTo(pa[0], pa[1]);
      ctx.lineTo(pc[0], pc[1]);
      ctx.stroke();
      if (glow){
        ctx.save();
        ctx.shadowColor = 'rgba('+AMBER+',0.6)';
        ctx.shadowBlur = 6;
        ctx.stroke();
        ctx.restore();
      }
    }
  }
  paint(bot, 0.42);
  paint(top, 1.00);
}


/* ---------- 测量标注 ---------- */
function drawMeasure(){
  /* 包围盒 */
  var minx=1e9, maxx=-1e9, miny=1e9, maxy=-1e9;
  for (var i=0;i<OUTER.V.length;i++){
    var p = project(OUTER.V[i], 0);
    if (p[0]<minx) minx=p[0];
    if (p[0]>maxx) maxx=p[0];
    if (p[1]<miny) miny=p[1];
    if (p[1]>maxy) maxy=p[1];
  }
  var pad = 16;
  minx -= pad; maxx += pad; miny -= pad; maxy += pad;

  ctx.save();
  ctx.strokeStyle = 'rgba('+AMBER+',0.20)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,5]);

  /* 四角的准星 */
  var cn = [[minx,miny,1,1],[maxx,miny,-1,1],[maxx,maxy,-1,-1],[minx,maxy,1,-1]];
  for (var i=0;i<4;i++){
    var c = cn[i], L = 9;
    ctx.beginPath();
    ctx.moveTo(c[0], c[1]+c[3]*L); ctx.lineTo(c[0], c[1]);
    ctx.lineTo(c[0]+c[2]*L, c[1]);
    ctx.stroke();
  }
  ctx.restore();

  /* 淡框 */
  ctx.save();
  ctx.strokeStyle = 'rgba('+AMBER+',0.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2,6]);
  ctx.strokeRect(minx, miny, maxx-minx, maxy-miny);
  ctx.restore();

  /* 宽度标注 */
  ctx.save();
  ctx.fillStyle = 'rgba('+AMBER2+',0.62)';
  ctx.font = '9px '+MONO;
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba('+AMBER+',0.32)';
  ctx.lineWidth = 1;
  var by = maxy + 22;
  ctx.beginPath();
  ctx.moveTo(minx, by); ctx.lineTo(maxx, by);
  ctx.moveTo(minx, by-4); ctx.lineTo(minx, by+4);
  ctx.moveTo(maxx, by-4); ctx.lineTo(maxx, by+4);
  ctx.stroke();
  ctx.fillText('一尺二寸', (minx+maxx)/2, by-6);

  /* 高度标注 */
  var bx = minx - 20;
  ctx.beginPath();
  ctx.moveTo(bx, miny); ctx.lineTo(bx, maxy);
  ctx.moveTo(bx-4, miny); ctx.lineTo(bx+4, miny);
  ctx.moveTo(bx-4, maxy); ctx.lineTo(bx+4, maxy);
  ctx.stroke();
  ctx.save();
  ctx.translate(bx-8, (miny+maxy)/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('一尺', 0, 0);
  ctx.restore();
  ctx.restore();

  /* 顶点小圆点：扫描仪正在取点 */
  ctx.save();
  ctx.fillStyle = 'rgba('+AMBER+',0.55)';
  for (var i=0;i<OUTER.V.length;i++){
    var p2 = project(OUTER.V[i], 0);
    ctx.beginPath();
    ctx.arc(p2[0], p2[1], 1.5, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();

  /* 左侧刻度尺 */
  ctx.save();
  ctx.strokeStyle = 'rgba('+AMBER+',0.22)';
  ctx.lineWidth = 1;
  var sy = H*0.16, ey = H*0.88;
  ctx.beginPath();
  ctx.moveTo(26, sy); ctx.lineTo(26, ey);
  for (var i=0;i<=32;i++){
    var yy = sy + (ey-sy)*i/32;
    var L2 = (i%4===0) ? 7 : 3.5;
    ctx.moveTo(26, yy); ctx.lineTo(26+L2, yy);
  }
  ctx.stroke();
  ctx.restore();

  /* 角度读数 */
  ctx.save();
  ctx.fillStyle = 'rgba('+AMBER2+',0.55)';
  ctx.font = '9.5px '+MONO;
  ctx.textAlign = 'right';
  var deg = ((cam.ry*180/Math.PI)%360+360)%360;
  ctx.fillText('θ  '+deg.toFixed(1)+'°', W*0.885, H*0.135);
  ctx.fillText('φ  '+(cam.rx*180/Math.PI).toFixed(1)+'°', W*0.885, H*0.152);
  ctx.restore();
}

/* ---------- 四把锁 ---------- */
var LOCKS = [];
function lockPositions(b){
  var out = [];
  var y = b.ry0 - b.h*0.030;
  var pts = [
    [-b.w, y, -b.d], [ b.w, y, -b.d],
    [ b.w, y,  b.d], [-b.w, y,  b.d]
  ];
  for (var i=0;i<4;i++){
    var p = project(pts[i], 0);
    out.push({ x:p[0], y:p[1], z:p[2], i:i, on:false, shake:0 });
  }
  return out;
}

var lockHit = -1, lockMsg = '', lockMsgT = 0;

/* ============================================================
   CRT 后处理素材
   ============================================================ */
var SCAN = null;
function bakeScan(){
  if (SCAN) return;
  var c = document.createElement('canvas');
  c.width = 4; c.height = 4;
  var x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.26)';
  x.fillRect(0,0,4,1);
  x.fillStyle = 'rgba(0,0,0,0.08)';
  x.fillRect(0,1,4,1);
  SCAN = ctx.createPattern(c,'repeat');
}

/* ============================================================
   状态
   ============================================================ */
var openLift = 0, openTarget = 0;
var scanY = -999, scanP = 0;
var lastT = performance.now();

/* ============================================================
   绘制
   ============================================================ */
function draw(){
  var now = performance.now();
  var dt = Math.min(60, now-lastT);
  lastT = now;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  var bg = ctx.createRadialGradient(W*0.5, H*0.46, 10, W*0.5, H*0.5, H*0.95);
  bg.addColorStop(0,   'rgb(14,10,7)');
  bg.addColorStop(0.55,'rgb(7,5,4)');
  bg.addColorStop(1,   'rgb(1,1,1)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  /* 惯性 */
  cam.ry += spin.vy; cam.rx += spin.vx;
  spin.vy *= 0.94; spin.vx *= 0.94;
  cam.rx = clamp(cam.rx, -0.85, 0.85);

  /* 盖子的开合 */
  openLift += (openTarget - openLift) * 0.12;

  PX = W*0.5;
  PY = H*0.50;
  PS = W*0.86;

  /* 地面投影：一圈椭圆，跟着旋转不变，给一点"放着"的感觉 */
  ctx.save();
  ctx.strokeStyle = 'rgba('+AMBER+',0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(PX, PY + PS*0.34, PS*0.52, PS*0.13, 0, 0, 6.2832);
  ctx.stroke();
  ctx.restore();

  /* 扫描平面：从上往下，扫到的线会亮起来 */
  scanP = ((now*0.00013) % 1);
  scanY = H*0.14 + (H*0.74)*scanP;

  /* 器物 */
  if (openLift > 0.02){
    drawBox(INNER2, openLift*0.30, 0.20, 0.9, false);
    drawBox(INNER,  openLift*0.16, 0.34, 1.0, false);
  }
  drawBox(OUTER, openLift*0.42, 1.0, 1.25, true);

  /* ---------- 测量层：这台机器在"量"它 ---------- */
  drawMeasure();

  /* 锁 */
  LOCKS = lockPositions(OUTER);
  for (var i=0;i<LOCKS.length;i++){
    var L = LOCKS[i];
    var lockOpen = L.on && openLift < 0.3;
    ctx.save();
    ctx.translate(L.x, L.y);
    if (L.shake > 0) ctx.translate((rnd(now*0.03)-0.5)*3*L.shake, 0);
    ctx.strokeStyle = 'rgba('+AMBER+','+(0.9-L.z*0.2).toFixed(3)+')';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = 'rgba('+AMBER+',0.8)';
    ctx.shadowBlur = 8;
    var s = 8.6;
    ctx.strokeRect(-s*0.62, -s*0.80, s*1.24, s*1.50);
    /* 锁梁：锁着是闭合，开了是抬起来 */
    ctx.beginPath();
    if (lockOpen){
      ctx.arc(0, -s*0.80, s*0.46, Math.PI*1.08, Math.PI*1.92);
    } else {
      ctx.arc(0, -s*0.80, s*0.46, Math.PI, Math.PI*2);
    }
    ctx.stroke();
    ctx.restore();
    if (L.shake > 0) L.shake -= 0.04;
  }

  /* 扫描线本体 */
  ctx.save();
  var sg = ctx.createLinearGradient(0, scanY-26, 0, scanY+26);
  sg.addColorStop(0,   'rgba('+AMBER+',0)');
  sg.addColorStop(0.5, 'rgba(255,244,220,0.16)');
  sg.addColorStop(1,   'rgba('+AMBER+',0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, scanY-26, W, 52);
  ctx.fillStyle = 'rgba(255,246,226,0.42)';
  ctx.fillRect(0, scanY-0.6, W, 1.2);
  ctx.restore();

  /* ---------- 界面文字 ---------- */
  ctx.save();
  ctx.fillStyle = 'rgb('+AMBER2+')';
  ctx.font = '10.5px '+MONO;
  ctx.textAlign = 'left';

  /* 左上：状态块 */
  ctx.globalAlpha = 0.95;
  var blink = (Math.floor(now/380)%2 === 0) ? 1 : 0.3;
  ctx.fillStyle = 'rgba(255,110,72,'+blink.toFixed(2)+')';
  ctx.beginPath(); ctx.arc(W*0.115+3.5, H*0.098, 3.2, 0, 6.2832); ctx.fill();

  ctx.fillStyle = 'rgba(255,228,196,0.92)';
  ctx.font = '11px '+MONO;
  ctx.fillText('掃描中', W*0.115+13, H*0.1025);

  ctx.fillStyle = 'rgba('+AMBER2+',0.62)';
  ctx.font = '10.5px '+MONO;
  ctx.fillText('石函 · 第一重', W*0.115, H*0.122);
  ctx.fillText('白雲庵後山', W*0.115, H*0.1385);

  /* 一条很短的竖线，把状态和器物分开 */
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = 'rgba('+AMBER+',1)';
  ctx.fillRect(W*0.115, H*0.150, 26, 1);

  /* 右上：主读数 —— 扫描深度，整块画面的视觉锚点 */
  var depth = Math.round(scanP*384);
  ctx.textAlign = 'right';
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(255,238,208,0.96)';
  ctx.font = '19px '+MONO;
  ctx.fillText(('0000'+depth).slice(-4), W*0.885, H*0.104);
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgb('+AMBER2+')';
  ctx.font = '9px '+MONO;
  ctx.fillText('mm　DEPTH', W*0.885, H*0.1175);

  ctx.globalAlpha = 0.42;
  ctx.fillText('θ '+(((cam.ry*180/Math.PI)%360+360)%360).toFixed(1)+'°', W*0.885, H*0.1335);
  ctx.fillText('φ '+(cam.rx*180/Math.PI).toFixed(1)+'°', W*0.885, H*0.147);

  /* 底部操作条：框起来，让它看起来是"可交互区" */
  ctx.globalAlpha = 0.30;
  ctx.fillStyle = 'rgba('+AMBER+',1)';
  ctx.fillRect(W*0.115, H*0.922, W*0.77, 1);
  ctx.fillRect(W*0.115, H*0.962, W*0.77, 1);
  ctx.globalAlpha = 0.66;
  ctx.fillStyle = 'rgba(255,226,190,0.86)';
  ctx.font = '10px '+MONO;
  ctx.textAlign = 'center';
  ctx.fillText('拖動旋轉　·　點鎖　·　雙擊掀蓋', W*0.5, H*0.948);
  ctx.restore();

  /* 点锁之后的一行字 */
  if (lockMsgT > 0){
    lockMsgT -= dt;
    var a = clamp(lockMsgT/400, 0, 1);
    ctx.save();
    ctx.globalAlpha = a*0.92;
    ctx.fillStyle = 'rgba(255,240,212,1)';
    ctx.font = '15px '+SERIF;
    ctx.textAlign = 'center';
    ctx.fillText(lockMsg, W*0.5, H*0.80);
    ctx.restore();
  }

  /* ---------- CRT ---------- */
  var nS = 11, gap = H/nS;
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  for (var i=0;i<nS;i++){
    var y = i*gap + gap*0.35;
    ctx.fillRect(0, y, 4.5, gap*0.22);
    ctx.fillRect(W-4.5, y, 4.5, gap*0.22);
  }

  bakeScan();
  ctx.save();
  ctx.globalAlpha = 0.34;
  ctx.fillStyle = SCAN;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  var bandY = ((now*0.030) % (H+320)) - 160;
  var bgr = ctx.createLinearGradient(0, bandY-80, 0, bandY+80);
  bgr.addColorStop(0,   'rgba('+AMBER+',0)');
  bgr.addColorStop(0.5, 'rgba('+AMBER+',0.030)');
  bgr.addColorStop(1,   'rgba('+AMBER+',0)');
  ctx.fillStyle = bgr;
  ctx.fillRect(0, bandY-80, W, 160);

  ctx.save();
  for (var i=0;i<160;i++){
    var s2 = Math.floor(now*0.5)*2654435761 + i*97;
    ctx.fillStyle = (rnd(s2*0.0031)>0.5) ? 'rgba(255,238,210,'+(0.012+rnd(s2*0.0021)*0.04).toFixed(3)+')'
                                          : 'rgba(0,0,0,0.06)';
    ctx.fillRect(rnd(s2*0.000713)*W, rnd(s2*0.00137)*H, 1, 1);
  }
  ctx.restore();

  var vg = ctx.createRadialGradient(W*0.5, H*0.47, H*0.30, W*0.5, H*0.5, H*0.88);
  vg.addColorStop(0,   'rgba(0,0,0,0)');
  vg.addColorStop(0.70,'rgba(0,0,0,0.13)');
  vg.addColorStop(1,   'rgba(0,0,0,0.60)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(draw);
}

/* ============================================================
   交互
   ============================================================ */
var g = { on:false, x0:0, y0:0, lastX:0, lastY:0, moved:0, t0:0 };

cv.addEventListener('pointerdown', function(e){
  var r = cv.getBoundingClientRect();
  g.on = true;
  g.x0 = e.clientX - r.left; g.y0 = e.clientY - r.top;
  g.lastX = g.x0; g.lastY = g.y0;
  g.moved = 0; g.t0 = performance.now();
}, {passive:true});

cv.addEventListener('pointermove', function(e){
  if (!g.on) return;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var dx = x - g.lastX, dy = y - g.lastY;
  g.lastX = x; g.lastY = y;
  g.moved += Math.abs(dx) + Math.abs(dy);
  cam.ry += dx * 0.010;
  cam.rx = clamp(cam.rx + dy * 0.006, -0.85, 0.85);
  spin.vy = dx * 0.0025;
  spin.vx = 0;
}, {passive:true});

cv.addEventListener('pointerup', function(e){
  if (!g.on) return;
  g.on = false;
  var r = cv.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;

  if (g.moved < 12){
    /* 点到了哪把锁 */
    var found = -1, best = 26;
    for (var i=0;i<LOCKS.length;i++){
      var L = LOCKS[i];
      var d2 = (L.x-x)*(L.x-x) + (L.y-y)*(L.y-y);
      if (d2 < best*best && L.z > -0.2){ best = Math.sqrt(d2); found = i; }
    }
    if (found >= 0){
      var L2 = LOCKS[found];
      L2.on = !L2.on;
      L2.shake = 1;
      if (L2.on){ lockMsg = '咔。'; }
      else { lockMsg = '鎖扣未動。'; }
      lockMsgT = 1600;
    } else {
      /* 空白处双击 = 掀盖 */
      if (performance.now() - g.t0 < 220){}
    }
    if (lockHit >= 0 && lockHit !== found){}
    lockHit = found;
  }
}, {passive:true});

/* 双击掀盖 */
var lastTap = 0;
cv.addEventListener('pointerdown', function(e){
  var t = performance.now();
  if (t - lastTap < 300){
    openTarget = openTarget > 0.5 ? 0 : 1;
  }
  lastTap = t;
}, {passive:true});

function resize(){
  var r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.width  = Math.floor(W*DPR);
  cv.height = Math.floor(H*DPR);
  SCAN = null;
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
